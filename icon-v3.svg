<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff424f"/>
      <stop offset="0.58" stop-color="#ef1428"/>
      <stop offset="1" stop-color="#d80a1d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b596b"/>
      <stop offset="1" stop-color="#141b24"/>
    </linearGradient>
  </defs>

  <!-- fundo branco do app icon -->
  <rect width="512" height="512" rx="112" fill="#ffffff"/>

  <!-- carro, todo dentro da safe area e sem qualquer faixa atravessando -->
  <g transform="translate(86 124)">
    <ellipse cx="170" cy="256" rx="128" ry="13" fill="#000" opacity="0.08"/>

    <!-- espelhos -->
    <path d="M47 103c-23-8-39-3-41 12-2 16 14 23 42 18l15-17-16-13Z" fill="url(#body)"/>
    <path d="M293 103c23-8 39-3 41 12 2 16-14 23-42 18l-15-17 16-13Z" fill="url(#body)"/>

    <!-- carroceria principal -->
    <path d="M64 92c11-45 40-72 78-80h56c38 8 67 35 78 80l25 23c10 9 15 21 15 35v69c0 17-14 31-31 31H55c-17 0-31-14-31-31v-69c0-14 5-26 15-35l25-23Z" fill="url(#body)"/>

    <!-- para-brisa -->
    <path d="M103 94c13-32 31-51 58-58h18c27 7 45 26 58 58H103Z" fill="url(#glass)"/>
    <path d="M119 87c15-24 30-35 47-40h8l-34 40h-21Z" fill="#fff" opacity="0.10"/>

    <!-- capô -->
    <path d="M91 113c32-12 126-12 158 0l-25 42H116l-25-42Z" fill="#ff6570" opacity="0.36"/>

    <!-- faróis -->
    <path d="M53 151c20-16 47-18 77-7l-13 34c-28 5-50-4-64-27Z" fill="#1f2731"/>
    <path d="M287 151c-20-16-47-18-77-7l13 34c28 5 50-4 64-27Z" fill="#1f2731"/>
    <path d="M64 153c16-9 34-10 52-4l-7 17c-18 3-34-1-45-13Z" fill="#ffffff"/>
    <path d="M276 153c-16-9-34-10-52-4l7 17c18 3 34-1 45-13Z" fill="#ffffff"/>

    <!-- grade superior -->
    <path d="M112 183h116l22 20-16 28H106l-16-28 22-20Z" fill="#151c25"/>
    <rect x="109" y="198" width="122" height="7" rx="3.5" fill="#2d3540"/>
    <rect x="116" y="213" width="108" height="7" rx="3.5" fill="#2d3540"/>

    <!-- entradas laterais, sem união entre elas -->
    <path d="M55 205c14-5 27-5 38 0l-10 25H60c-6-7-7-15-5-25Z" fill="#202833"/>
    <path d="M285 205c-14-5-27-5-38 0l10 25h23c6-7 7-15 5-25Z" fill="#202833"/>

    <!-- pneus independentes -->
    <rect x="64" y="235" width="36" height="38" rx="14" fill="#171e27"/>
    <rect x="240" y="235" width="36" height="38" rx="14" fill="#171e27"/>
  </g>
</svg>
