<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3b48"/>
      <stop offset="0.55" stop-color="#f31328"/>
      <stop offset="1" stop-color="#d90017"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#465569"/>
      <stop offset="1" stop-color="#141b25"/>
    </linearGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8edf2"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- fundo branco limpo, estilo ícone iOS -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="#ffffff"/>
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#f0f0f0" stroke-width="3"/>

  <!-- sombra neutra, sem faixa vermelha -->
  <ellipse cx="256" cy="392" rx="142" ry="18" fill="#000000" opacity="0.10" filter="url(#shadow)"/>

  <!-- carro dentro da safe area -->
  <g transform="translate(72 113)">
    <!-- espelhos -->
    <path fill="url(#red)" d="M46 119c-27-8-42-3-44 13-2 18 16 25 50 20l10-19-16-14Z"/>
    <path fill="url(#red)" d="M322 119c27-8 42-3 44 13 2 18-16 25-50 20l-10-19 16-14Z"/>
    <path fill="#151c25" d="M16 144c12 9 27 11 42 7l4-18-46 11Z" opacity=".92"/>
    <path fill="#151c25" d="M352 144c-12 9-27 11-42 7l-4-18 46 11Z" opacity=".92"/>

    <!-- carroceria -->
    <path fill="url(#red)" d="M67 98c12-52 46-82 91-89h52c45 7 79 37 91 89l25 24c10 10 16 23 16 38v79c0 18-15 33-33 33H59c-18 0-33-15-33-33v-79c0-15 6-28 16-38l25-24Z"/>

    <!-- para-brisa -->
    <path fill="url(#glass)" d="M104 99c13-37 35-59 66-65h28c31 6 53 28 66 65H104Z"/>
    <path fill="#ffffff" opacity=".11" d="M121 91c16-29 33-43 54-48h6l-46 48h-14Z"/>

    <!-- capô -->
    <path fill="#ff6972" opacity=".42" d="M92 118c26-16 158-16 184 0l-28 48H120l-28-48Z"/>

    <!-- faróis -->
    <path fill="#202832" d="M56 157c22-18 53-21 89-8l-18 42c-31 5-57-6-71-34Z"/>
    <path fill="#202832" d="M312 157c-22-18-53-21-89-8l18 42c31 5 57-6 71-34Z"/>
    <path fill="url(#lamp)" d="M66 158c18-11 39-12 62-5l-9 23c-22 4-40-2-53-18Z"/>
    <path fill="url(#lamp)" d="M302 158c-18-11-39-12-62-5l9 23c22 4 40-2 53-18Z"/>

    <!-- grade principal -->
    <path fill="#151c25" d="M111 188h146l27 25-20 39H104l-20-39 27-25Z"/>
    <path fill="#2c3542" d="M103 208h162v9H103zm6 18h150v9H109z"/>

    <!-- entradas inferiores, separadas e limpas -->
    <path fill="#202832" d="M54 219c16-6 31-6 45 1l-13 29H58c-7-8-9-18-4-30Z"/>
    <path fill="#202832" d="M314 219c-16-6-31-6-45 1l13 29h28c7-8 9-18 4-30Z"/>

    <!-- pneus -->
    <path fill="#151c25" d="M70 255h43v23c0 13-10 23-23 23h-3c-9 0-17-7-17-17v-29Z"/>
    <path fill="#151c25" d="M255 255h43v29c0 10-8 17-17 17h-3c-13 0-23-10-23-23v-23Z"/>
