name: Usar logo Omni enviada

on:
  push:
    paths:
      - '.github/workflows/use-exact-omni-logo-v3.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Criar logo Omni e atualizar vitrine publica
        shell: bash
        run: |
          cat > /tmp/omni.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < /tmp/omni.b64 | base64 -d > omni-logo-crediti.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<span className="h-8 min-w-[42px] px-1 rounded-lg bg-white/90 flex items-center justify-center shrink-0" title="Omni Financeira"><span className="text-[13px] leading-none font-black italic tracking-[-.08em] text-[#123B6D]">omni</span></span>'
          new='<span className="h-8 min-w-[46px] px-1 rounded-lg bg-white/90 flex items-center justify-center shrink-0" title="Omni Financeira"><img src="/omni-logo-crediti.png" alt="Omni Financeira" className="w-10 h-6 object-contain"/></span>'
          if old not in s:
              raise SystemExit('bloco Omni atual nao encontrado')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          test -s omni-logo-crediti.png
          grep -q '/omni-logo-crediti.png' index.html
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html omni-logo-crediti.png
          git commit -m "Usar logo correta da Omni no catalogo publico"
          git push
