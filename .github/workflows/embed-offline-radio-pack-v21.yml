name: Embutir pacote offline da Radio Crediti
on:
  push:
    paths:
      - '.github/workflows/embed-offline-radio-pack-v21.yml'
permissions:
  contents: write
jobs:
  build-offline-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar faixas CC0 para dentro do projeto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request, json, time

          base='https://raw.githubusercontent.com/uncle-sheepsky/duru-ai-cc0-bgm/main/mp3/'
          tracks = [
            ('Lo-fi','Duru Roomscene Lo-fi','duru-roomscene-lofi.mp3'),
            ('Arcade','Duru Arcade Vibe','duru-arcade-vibe.mp3'),
            ('Eletrônica','Duru Denparcade','duru-denparcade.mp3'),
            ('Dance','Duru Rhythm Fever','duru-rhythm-fever.mp3'),
            ('Instrumental','Duru Rondo','duru-rondo.mp3'),
            ('Eletrônica','Duru Winter Arcade','duru-winter-arcade.mp3'),
            ('Instrumental','Duru AI Music','duru-ai-ep2-music.mp3'),
            ('Ritmo','Hyak Rhythm','hyak-ep1-rhythm.mp3'),
          ]
          out = Path('offline-audio')
          out.mkdir(exist_ok=True)
          manifest=[]
          for category,title,source in tracks:
              url=base+source
              dest=out/source
              print('Baixando', title)
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=90) as r, open(dest,'wb') as f:
                  data=r.read()
                  if len(data)<50000:
                      raise RuntimeError(f'Arquivo muito pequeno para {title}: {len(data)} bytes')
                  f.write(data)
              manifest.append({'title':title,'category':category,'file':'/offline-audio/'+source,'bytes':dest.stat().st_size})
              time.sleep(.2)
          (out/'playlist.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (out/'README.txt').write_text(
            'Pacote offline da Rádio Crediti. Faixas CC0 do projeto duru-ai-cc0-bgm. Fonte: https://github.com/uncle-sheepsky/duru-ai-cc0-bgm\n',
            encoding='utf-8'
          )
          print('Faixas prontas:', len(manifest), 'Total bytes:', sum(x['bytes'] for x in manifest))
          PY
      - name: Commitar pacote offline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline-audio
          git diff --cached --quiet && exit 0
          git commit -m "Adicionar pacote local CC0 da Radio Crediti"
          git push
