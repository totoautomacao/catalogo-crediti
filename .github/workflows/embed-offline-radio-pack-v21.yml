name: Embutir pacote offline da Radio Crediti
on:
  push:
    paths:
      - '.github/workflows/embed-offline-radio-pack-v21.yml'
permissions:
  contents: write
jobs:
  build-offline-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar faixas CC0 para dentro do projeto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request, json, time

          tracks = [
            ('Comedy','Alls Fair In Love','01-alls-fair-in-love.mp3'),
            ('Comedy','Silly Intro','02-silly-intro.mp3'),
            ('Comedy','Vintage Party','03-vintage-party.mp3'),
            ('Electronic','3 am West End','04-3-am-west-end.mp3'),
            ('Electronic','Arpent','05-arpent.mp3'),
            ('Electronic','Backbeat','06-backbeat.mp3'),
            ('Romance','Amazing Grace','07-amazing-grace.mp3'),
            ('Romance','Lovely Piano Song','08-lovely-piano-song.mp3'),
            ('Upbeat','Advertime','09-advertime.mp3'),
            ('Upbeat','City Sunshine','10-city-sunshine.mp3'),
            ('World','Ambient Bongos','11-ambient-bongos.mp3'),
            ('World','Bollywood Groove','12-bollywood-groove.mp3'),
          ]
          out = Path('offline-audio')
          out.mkdir(exist_ok=True)
          manifest=[]
          for category,title,filename in tracks:
              encoded=(category+'/'+title+'.mp3').encode().hex()
              url='https://en.freepd.cn/api/music/'+encoded
              dest=out/filename
              print('Baixando', title)
              req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=90) as r, open(dest,'wb') as f:
                  data=r.read()
                  if len(data)<50000:
                      raise RuntimeError(f'Arquivo muito pequeno para {title}: {len(data)} bytes')
                  f.write(data)
              manifest.append({'title':title,'category':category,'file':'/offline-audio/'+filename,'bytes':dest.stat().st_size})
              time.sleep(.2)
          (out/'playlist.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          (out/'README.txt').write_text('Pacote offline da Rádio Crediti. Faixas oriundas da biblioteca FreePD, indicada como domínio público/CC0 em https://en.freepd.cn/music\n', encoding='utf-8')
          print('Faixas prontas:', len(manifest), 'Total bytes:', sum(x['bytes'] for x in manifest))
          PY
      - name: Commitar pacote offline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offline-audio
          git diff --cached --quiet && exit 0
          git commit -m "Adicionar pacote de musicas offline da Radio Crediti"
          git push
