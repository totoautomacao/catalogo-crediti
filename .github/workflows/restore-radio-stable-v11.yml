name: Radio Crediti estavel final

on:
  push:
    paths:
      - '.github/workflows/restore-radio-stable-v11.yml'

permissions:
  contents: write

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar versao comprovadamente estavel
        run: |
          git show b0e0d72f8ad2552b47848f2d935f84dbbe7b5ff1:radio-crediti.js > radio-crediti.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if re.search(r'/radio-crediti\.js\?v=\d+', s):
              s=re.sub(r'/radio-crediti\.js\?v=\d+', '/radio-crediti.js?v=11', s, count=1)
          elif '/radio-crediti.js' in s:
              s=s.replace('/radio-crediti.js','/radio-crediti.js?v=11',1)
          else:
              raise SystemExit('referencia do player nao encontrada')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'Volume: botões do iPhone' radio-crediti.js
          ! grep -q 'crVolDown' radio-crediti.js
          ! grep -q '/api/radio?i=' radio-crediti.js
      - name: Publicar versao estavel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio-crediti.js index.html
          git commit -m "Restaurar Radio Crediti estavel com volume nativo no iPhone"
          git push
