name: Reparar e otimizar Android

on:
  push:
    paths:
      - '.github/workflows/repair-optimize-android-v18.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restaurar ultima base estavel
        run: |
          git show 4bc899714fdead3ad9805a7a25eaaa50a7c6fe90:index.html > index.html
          git show 4bc899714fdead3ad9805a7a25eaaa50a7c6fe90:sw.js > sw.js

      - name: Separar fonte e preparar HTML corretamente
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          html=p.read_text(encoding='utf-8')
          m=re.search(r'<script type="text/babel">([\s\S]*?)</script>', html)
          if not m:
              raise SystemExit('Bloco React original nao encontrado')
          source=m.group(1).strip()+"\n"
          Path('app-source.jsx').write_text(source, encoding='utf-8')

          urls=[
            'https://cdn.tailwindcss.com',
            'https://unpkg.com/react@18/umd/react.production.min.js',
            'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
            'https://unpkg.com/@babel/standalone/babel.min.js',
            'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
            'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js'
          ]
          for u in urls:
              html=re.sub(r'\s*<script[^>]*src="'+re.escape(u)+r'"[^>]*></script>\s*','\n',html)
          html=re.sub(r'\s*<link rel="preconnect" href="https://fonts.googleapis.com"[^>]*>\s*','\n',html)
          html=re.sub(r'\s*<link rel="preconnect" href="https://fonts.gstatic.com"[^>]*>\s*','\n',html)
          html=re.sub(r'\s*<link href="https://fonts.googleapis.com[^>]*>\s*','\n',html)

          html=html.replace('<style>','<link rel="preload" href="/tailwind.css?v=18" as="style" />\n<link rel="stylesheet" href="/tailwind.css?v=18" />\n<link rel="preload" href="/app.js?v=18" as="script" />\n<style>',1)

          loader='''<div id="root"><div id="crediti-boot" style="min-height:100vh;background:#F5F6F2;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><div style="width:min(420px,92vw);background:#fff;border-radius:28px;padding:26px;text-align:center;box-shadow:0 12px 36px rgba(18,18,18,.07)"><div style="width:58px;height:58px;border-radius:18px;background:#FDCA01;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:28px">🚗</div><div style="font-size:22px;font-weight:800;color:#111">Crediti</div><div style="margin-top:5px;font-size:13px;font-weight:600;color:#777">Abrindo catálogo…</div></div></div></div>'''
          html=html.replace('<div id="root"></div>',loader,1)
          html=re.sub(r'<script type="text/babel">[\s\S]*?</script>','<script src="/app.js?v=18" defer></script>',html,count=1)
          p.write_text(html,encoding='utf-8')
          PY

      - name: Gerar bundle local
        run: |
          npm install --no-save esbuild@0.25.10 react@18 react-dom@18 @supabase/supabase-js@2 heic2any@0.0.4 tailwindcss@3.4.17
          cat > entry.jsx <<'EOF'
          import ReactLib from 'react';
          import { createRoot } from 'react-dom/client';
          import { createClient as supabaseCreateClient } from '@supabase/supabase-js';
          import heic2anyLib from 'heic2any';
          const React = ReactLib;
          const ReactDOM = { createRoot };
          const supabase = { createClient: supabaseCreateClient };
          window.heic2any = heic2anyLib;
          EOF
          cat app-source.jsx >> entry.jsx
          npx esbuild entry.jsx --bundle --minify --format=iife --platform=browser --target=es2018 --outfile=app.js

      - name: Gerar CSS local
        run: |
          cat > tailwind-input.css <<'EOF'
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
          EOF
          cat > tailwind.config.js <<'EOF'
          module.exports={content:['./index.html','./app-source.jsx'],theme:{extend:{}},plugins:[]}
          EOF
          npx tailwindcss -c tailwind.config.js -i tailwind-input.css -o tailwind.css --minify

      - name: Atualizar cache offline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r"const CORE='catalogo-crediti-v\d+';","const CORE='catalogo-crediti-v14';",s)
          s=re.sub(r"const VENDOR_FILES=\[[\s\S]*?\];","const VENDOR_FILES=[];",s,count=1)
          if "'/app.js'" not in s:
              s=s.replace("'/bank-c6.png'","'/bank-c6.png','/app.js','/tailwind.css'")
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar HTML antes de publicar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'type="text/babel"' not in s
          assert '<script src="/app.js?v=18" defer></script>' in s
          assert 'cdn.tailwindcss.com' not in s
          assert 'babel.min.js' not in s
          assert s.count('id="root"')==1
          assert s.count('</html>')==1
          print('HTML validado')
          PY
          test -s app.js
          test -s tailwind.css

      - name: Limpar temporarios
        run: |
          rm -f entry.jsx tailwind-input.css tailwind.config.js package.json package-lock.json
          rm -rf node_modules

      - name: Publicar reparo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-source.jsx app.js tailwind.css sw.js
          git commit -m "Reparar e acelerar catalogo no Android"
          git push

# reexecutar v18
