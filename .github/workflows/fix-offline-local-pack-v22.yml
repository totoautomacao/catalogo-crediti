name: Usar pacote local na Radio Crediti offline
on:
  push:
    paths:
      - '.github/workflows/fix-offline-local-pack-v22.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correção offline
        run: python3 scripts/fix_offline_local_pack_v22.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio-crediti.js sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Tocar pacote local quando a Radio Crediti estiver offline"
          git push
