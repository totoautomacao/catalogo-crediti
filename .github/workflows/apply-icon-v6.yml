name: Aplicar ícone limpo PWA v6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-icon-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Pillow
        run: pip install pillow

      - name: Gerar ícones novos a partir da arte aprovada
        run: |
          python - <<'PY'
          from PIL import Image
          img=Image.open('icon-approved-v6.jpg').convert('RGB')
          for size,name in [
              (192,'icon-clean-192-v6.png'),
              (512,'icon-clean-512-v6.png'),
              (180,'apple-touch-icon-clean-v6.png')
          ]:
              img.resize((size,size),Image.Resampling.LANCZOS).save(name,'PNG',optimize=True)
          PY

      - name: Atualizar manifesto do PWA
        run: |
          cat > manifest.webmanifest <<'JSON'
          {
            "id": "/",
            "name": "Catálogo Crediti",
            "short_name": "Catálogo Crediti",
            "description": "Catálogo de veículos Crediti",
            "start_url": "/",
            "scope": "/",
            "display": "standalone",
            "orientation": "portrait-primary",
            "background_color": "#ffffff",
            "theme_color": "#FDCA01",
            "icons": [
              {"src":"/icon-clean-192-v6.png","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"/icon-clean-512-v6.png","sizes":"512x512","type":"image/png","purpose":"any"}
            ]
          }
          JSON

      - name: Apontar iPhone e navegador para os novos arquivos
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<link rel="manifest"[^>]*>', '<link rel="manifest" href="/manifest.webmanifest?v=6" />', s, count=1)
          s=re.sub(r'<link rel="icon"[^>]*>', '<link rel="icon" type="image/png" sizes="192x192" href="/icon-clean-192-v6.png" />', s, count=1)
          s=re.sub(r'<link rel="apple-touch-icon"[^>]*>', '<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-clean-v6.png" />', s, count=1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Renovar cache do PWA
        run: |
          cat > sw.js <<'JS'
          const CACHE='catalogo-crediti-v6';
          self.addEventListener('install',()=>self.skipWaiting());
          self.addEventListener('activate',event=>event.waitUntil((async()=>{
            const keys=await caches.keys();
            await Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)));
            await self.clients.claim();
          })()));
          self.addEventListener('fetch',()=>{});
          JS

      - name: Publicar no main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-clean-192-v6.png icon-clean-512-v6.png apple-touch-icon-clean-v6.png manifest.webmanifest index.html sw.js
          git commit -m "Aplicar ícone limpo aprovado no PWA v6"
          git push
