name: Localizar logos dos bancos

on:
  push:
    paths:
      - '.github/workflows/local-bank-logos-v14.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localizar e otimizar logos
        run: python3 scripts/localize_bank_logos.py
      - name: Validar
        run: |
          test -s bank-itau.png
          test -s bank-bradesco.png
          test -s bank-santander.png
          test -s bank-bv.png
          test -s bank-pan.png
          test -s bank-safra.png
          test -s bank-volkswagen.png
          test -s bank-c6.png
          if grep -q 'www.google.com/s2/favicons' index.html; then exit 1; fi
          grep -q 'data-crediti-bank-preload="1"' index.html
          grep -q 'catalogo-crediti-v10' sw.js
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js bank-*.png
          git commit -m "Carregar logos dos bancos instantaneamente"
          git push
