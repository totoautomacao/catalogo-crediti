name: Localizar logos dos bancos

on:
  push:
    paths:
      - '.github/workflows/local-bank-logos-v14.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar logos para o proprio catalogo
        run: |
          set -e
          curl -L --fail --silent --show-error --retry 3 --max-time 30 'https://www.google.com/s2/favicons?domain_url=https://www.itau.com.br&sz=128' -o bank-itau.png
          curl -L --fail --silent --show-error --retry 3 --max-time 30 'https://www.google.com/s2/favicons?domain_url=https://banco.bradesco&sz=128' -o bank-bradesco.png
          curl -L --fail --silent --show-error --retry 3 --max-time 30 'https://www.google.com/s2/favicons?domain_url=https://www.santander.com.br&sz=128' -o bank-santander.png
          curl -L --fail --silent --show-error --retry 3 --max-time 30 'https://www.google.com/s2/favicons?domain_url=https://www.bv.com.br&sz=128' -o bank-bv.png
          curl -L --fail --silent --show-error --retry 3 --max-time 30 'https://www.google.com/s2/favicons?domain_url=https://www.bancopan.com.br&sz=128' -o bank-pan.png
          curl -L --fail --silent --show-error --retry 3 --max-time 30 'https://www.google.com/s2/favicons?domain_url=https://www.safra.com.br&sz=128' -o bank-safra.png
          curl -L --fail --silent --show-error --retry 3 --max-time 30 'https://www.google.com/s2/favicons?domain_url=https://www.vwfs.com.br&sz=128' -o bank-volkswagen.png
          curl -L --fail --silent --show-error --retry 3 --max-time 30 'https://www.google.com/s2/favicons?domain_url=https://www.c6bank.com.br&sz=128' -o bank-c6.png
      - name: Trocar logos externas por arquivos locais e preload
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          repl={
            'https://www.google.com/s2/favicons?domain_url=https://www.itau.com.br&sz=128':'/bank-itau.png',
            'https://www.google.com/s2/favicons?domain_url=https://banco.bradesco&sz=128':'/bank-bradesco.png',
            'https://www.google.com/s2/favicons?domain_url=https://www.santander.com.br&sz=128':'/bank-santander.png',
            'https://www.google.com/s2/favicons?domain_url=https://www.bv.com.br&sz=128':'/bank-bv.png',
            'https://www.google.com/s2/favicons?domain_url=https://www.bancopan.com.br&sz=128':'/bank-pan.png',
            'https://www.google.com/s2/favicons?domain_url=https://www.safra.com.br&sz=128':'/bank-safra.png',
            'https://www.google.com/s2/favicons?domain_url=https://www.vwfs.com.br&sz=128':'/bank-volkswagen.png',
            'https://www.google.com/s2/favicons?domain_url=https://www.c6bank.com.br&sz=128':'/bank-c6.png',
            '/omni-logo-crediti.png?v=1':'/omni-logo-crediti.png',
          }
          for old,new in repl.items():
              if old not in s:
                  raise SystemExit(f'URL alvo nao encontrada: {old}')
              s=s.replace(old,new)

          preload='''\n<link rel="preload" as="image" href="/bank-itau.png" fetchpriority="high" />
<link rel="preload" as="image" href="/bank-bradesco.png" fetchpriority="high" />
<link rel="preload" as="image" href="/bank-santander.png" fetchpriority="high" />
<link rel="preload" as="image" href="/bank-bv.png" fetchpriority="high" />
<link rel="preload" as="image" href="/bank-pan.png" fetchpriority="high" />
<link rel="preload" as="image" href="/omni-logo-crediti.png" fetchpriority="high" />
<link rel="preload" as="image" href="/bank-safra.png" fetchpriority="high" />
<link rel="preload" as="image" href="/bank-volkswagen.png" fetchpriority="high" />
<link rel="preload" as="image" href="/bank-c6.png" fetchpriority="high" />'''
          marker='<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-exact-v7.png" />'
          if '/bank-itau.png" fetchpriority="high"' not in s:
              if marker not in s:
                  raise SystemExit('Marcador de preload nao encontrado')
              s=s.replace(marker,marker+preload,1)

          for name in ['bank-itau.png','bank-bradesco.png','bank-santander.png','bank-bv.png','bank-pan.png','omni-logo-crediti.png','bank-safra.png','bank-volkswagen.png','bank-c6.png']:
              s=s.replace(f'src="/{name}"',f'src="/{name}" loading="eager" decoding="async" fetchPriority="high"')

          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          t=re.sub(r"const CORE='catalogo-crediti-v\d+'","const CORE='catalogo-crediti-v10'",t,count=1)
          old="const CORE_FILES=['/','/index.html','/radio-crediti.js','/manifest.webmanifest','/icon-exact-192-v7.png'];"
          new="const CORE_FILES=['/','/index.html','/radio-crediti.js','/manifest.webmanifest','/icon-exact-192-v7.png','/bank-itau.png','/bank-bradesco.png','/bank-santander.png','/bank-bv.png','/bank-pan.png','/omni-logo-crediti.png','/bank-safra.png','/bank-volkswagen.png','/bank-c6.png'];"
          if old not in t:
              raise SystemExit('CORE_FILES alvo nao encontrado')
          t=t.replace(old,new,1)
          sw.write_text(t,encoding='utf-8')
          PY
      - name: Validar arquivos e referencias
        run: |
          test -s bank-itau.png
          test -s bank-bradesco.png
          test -s bank-santander.png
          test -s bank-bv.png
          test -s bank-pan.png
          test -s bank-safra.png
          test -s bank-volkswagen.png
          test -s bank-c6.png
          ! grep -q 'www.google.com/s2/favicons' index.html
          grep -q '/bank-itau.png' index.html
          grep -q 'catalogo-crediti-v10' sw.js
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js bank-*.png
          git commit -m "Carregar logos dos bancos instantaneamente"
          git push
