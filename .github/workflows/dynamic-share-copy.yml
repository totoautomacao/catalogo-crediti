name: Gerar mensagens dinamicas no compartilhamento

on:
  push:
    paths:
      - '.github/workflows/dynamic-share-copy.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Atualizar gerador de mensagens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          helpers = r'''
