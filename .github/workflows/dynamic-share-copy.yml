function creditRandom(max){
  if(window.crypto&&window.crypto.getRandomValues){const a=new Uint32Array(1);window.crypto.getRandomValues(a);return a[0]%max}
  return Math.floor(Math.random()*max)
}
function creditPick(lista){return lista[creditRandom(lista.length)]}
function creditNomeVeiculo(v){return [v?.marca,v?.modelo].filter(Boolean).join(' ').trim()||'este veículo'}
function creditSalvarHistorico(chave){
  try{const k='crediti_share_history_v1';const atual=JSON.parse(localStorage.getItem(k)||'[]');const novo=[chave,...atual.filter(x=>x!==chave)].slice(0,100);localStorage.setItem(k,JSON.stringify(novo))}catch{}
}
function creditJaUsado(chave){try{return JSON.parse(localStorage.getItem('crediti_share_history_v1')||'[]').includes(chave)}catch{return false}}
function gerarGatilhoCrediti(v){
  const nome=creditNomeVeiculo(v);const isMoto=String(v?.categoria||'').toLowerCase().includes('moto');const beneficios=isMoto?CREDITI_BENEFICIOS_MOTO:CREDITI_BENEFICIOS_CARRO;
  let indices,chave,tentativas=0;
  do{
    indices=[creditRandom(CREDITI_GATILHOS_ABERTURAS.length),creditRandom(beneficios.length),creditRandom(CREDITI_URGENCIAS.length),creditRandom(CREDITI_EMOCOES.length),creditRandom(CREDITI_CTAS.length)];
    chave=`${indices.join('-')}-${isMoto?'m':'c'}`;tentativas++;
  }while(creditJaUsado(chave)&&tentativas<30);
  creditSalvarHistorico(chave);
  return CREDITI_GATILHOS_ABERTURAS[indices[0]].replaceAll('{veiculo}',nome)+'\n\n'+beneficios[indices[1]]+'\n\n'+CREDITI_URGENCIAS[indices[2]]+'\n\n'+CREDITI_EMOCOES[indices[3]]+'\n\n📲 *'+CREDITI_CTAS[indices[4]]+'*';
}
function montarMensagemCompartilhamento(v){
  const nome=creditNomeVeiculo(v);const linhas=['🚘 *OPORTUNIDADE CREDITI*','',`*${nome}*`];
  if(v?.versao&&v.versao!==v.modelo)linhas.push(`Versão: ${v.versao}`);
  if(v?.ano_fabricacao||v?.ano_modelo)linhas.push(`Ano: ${v.ano_fabricacao||'-'}/${v.ano_modelo||'-'}`);
  if(Number(v?.quilometragem||0)>0)linhas.push(`KM: ${numeroBR(v.quilometragem)} km`);
  if(v?.descricao)linhas.push('',`✅ ${v.descricao}`);
  if(Number(v?.nosso_valor||0)>0)linhas.push('',`💰 *PREÇO CREDITI: ${dinheiro(v.nosso_valor)}*`);
  linhas.push('',gerarGatilhoCrediti(v));
  return linhas.join('\n');
}
'''

          if 'const CREDITI_GATILHOS_ABERTURAS=' not in s:
              s = s.replace('function App(){', helpers + '\nfunction App(){', 1)

          pattern = re.compile(r"  const texto=`🚘 \*OPORTUNIDADE CREDITI\*.*?📲 \*Quer que eu confirme a disponibilidade para você\?\*`;", re.S)
          s2, count = pattern.subn("  const texto=montarMensagemCompartilhamento(v);", s, count=1)
          if count != 1:
              raise SystemExit(f'Não foi possível localizar a mensagem fixa antiga. Ocorrências: {count}')

          path.write_text(s2, encoding='utf-8')
          PY

      - name: Validar alteração
        run: |
          grep -q "CREDITI_GATILHOS_ABERTURAS" index.html
          grep -q "montarMensagemCompartilhamento(v)" index.html

      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Gerar mensagens persuasivas dinamicas no compartilhamento"
          git push
