name: Ajustar cabecalho catalogo publico

on:
  push:
    paths:
      - '.github/workflows/public-header-copy.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar texto publico
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'Escolha seu próximo veículo.'","'Navegue, escolha seu veículo.'",1)
          s=s.replace("'Veja os veículos disponíveis e fale direto com a Crediti pelo WhatsApp.'","'Fale rapidamente com nosso vendedor para uma simulação em cinco minutos.'",1)
          aviso='{CREDITI_MODO_CLIENTE&&<div className="mt-5 inline-flex items-center gap-2 rounded-2xl bg-white/70 px-4 py-3 text-sm font-bold">Somente o preço Crediti é exibido neste catálogo.</div>}'
          if aviso not in s:
              raise SystemExit('Aviso publico nao encontrado')
          s=s.replace(aviso,'',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar
        run: |
          grep -q "Navegue, escolha seu veículo." index.html
          grep -q "simulação em cinco minutos" index.html
          ! grep -q "Somente o preço Crediti é exibido neste catálogo" index.html
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Ajustar cabecalho do catalogo publico"
          git push
