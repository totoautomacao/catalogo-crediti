name: Galeria nativa e catalogo rapido v31

on:
  push:
    paths:
      - '.github/workflows/react-gallery-v31.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Integrar galeria diretamente no React
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('app-source.jsx')
          s=p.read_text(encoding='utf-8')

          if 'galeriaVeiculo' not in s:
              marker='function App(){'
              if marker not in s: raise SystemExit('App nao encontrado')
              s=s.replace(marker, marker+"\n const [galeriaVeiculo,setGaleriaVeiculo]=useState(null);\n const [galeriaIndice,setGaleriaIndice]=useState(0);\n const [galeriaTouchX,setGaleriaTouchX]=useState(null);",1)

              ret=s.index(' return <div className=')
              helpers=r'''
 function abrirGaleriaVeiculo(v){
  const fotos=[...(v?.fotos_veiculo||[])].filter(f=>f?.url_foto).sort((a,b)=>(a.ordem||99)-(b.ordem||99));
  if(!fotos.length)return;
  setGaleriaVeiculo({veiculo:v,fotos});setGaleriaIndice(0);setGaleriaTouchX(null);
 }
 function fecharGaleriaVeiculo(){setGaleriaVeiculo(null);setGaleriaIndice(0);setGaleriaTouchX(null)}
 function moverGaleriaVeiculo(delta){
  if(!galeriaVeiculo?.fotos?.length)return;
  setGaleriaIndice(i=>(i+delta+galeriaVeiculo.fotos.length)%galeriaVeiculo.fotos.length);
 }
'''
              s=s[:ret]+helpers+s[ret:]

          old='<div className="h-64 bg-white flex items-center justify-center overflow-hidden">{v.fotos_veiculo?.[0]?.url_foto?<img src={v.fotos_veiculo[0].url_foto} className="w-full h-full object-contain" alt={`${v.marca} ${v.modelo}`}/>:<div className="text-black/25 font-semibold">Sem foto</div>}</div><div className="p-5 flex flex-col flex-1">'
          new='<div onClick={()=>abrirGaleriaVeiculo(v)} role="button" tabIndex={0} onKeyDown={e=>{if(e.key===\'Enter\'||e.key===\' \')abrirGaleriaVeiculo(v)}} className="h-64 bg-white flex items-center justify-center overflow-hidden relative cursor-zoom-in">{v.fotos_veiculo?.[0]?.url_foto?<img src={v.fotos_veiculo[0].url_foto} loading="lazy" decoding="async" className="w-full h-full object-contain" alt={`${v.marca} ${v.modelo}`}/>:<div className="text-black/25 font-semibold">Sem foto</div>}{v.fotos_veiculo?.length>0&&<span className="absolute left-3 bottom-3 rounded-full bg-black/85 text-white px-3 py-2 text-[10px] font-extrabold tracking-wide pointer-events-none">{v.fotos_veiculo.length>1?`VER ${v.fotos_veiculo.length} FOTOS`:\'AMPLIAR FOTO\'}</span>}</div><div className="p-5 flex flex-col flex-1">'
          if old not in s: raise SystemExit('Area da foto do card nao encontrada')
          s=s.replace(old,new,1)

          marker=' </section></main></div>\n}\nReactDOM.createRoot'
          if marker not in s: raise SystemExit('Final do app nao encontrado')
          modal=r''' </section>
 {galeriaVeiculo&&<div className="fixed inset-0 z-[120] bg-black/80 flex items-center justify-center p-2 sm:p-4" onClick={fecharGaleriaVeiculo}><div className="w-full max-w-5xl max-h-[96vh] bg-white rounded-[24px] overflow-hidden shadow-2xl" onClick={e=>e.stopPropagation()}><div className="flex items-center justify-between gap-3 px-4 py-3 border-b border-black/10"><div className="min-w-0"><div className="text-[10px] uppercase tracking-[.14em] text-black/40 font-extrabold">Galeria do veículo</div><div className="font-extrabold text-lg truncate">{[galeriaVeiculo.veiculo?.marca,galeriaVeiculo.veiculo?.modelo].filter(Boolean).join(' ')||'Veículo Crediti'}</div><div className="text-xs font-bold text-black/45">{galeriaIndice+1} de {galeriaVeiculo.fotos.length} foto{galeriaVeiculo.fotos.length>1?'s':''}</div></div><button type="button" onClick={fecharGaleriaVeiculo} className="w-11 h-11 flex-none rounded-2xl bg-[#F2F2ED] font-extrabold text-2xl">×</button></div><div className="relative h-[58vh] sm:h-[65vh] min-h-[260px] bg-[#F5F6F2] flex items-center justify-center overflow-hidden" onTouchStart={e=>setGaleriaTouchX(e.touches?.[0]?.clientX??null)} onTouchEnd={e=>{if(galeriaTouchX==null)return;const x=e.changedTouches?.[0]?.clientX??galeriaTouchX;const d=x-galeriaTouchX;setGaleriaTouchX(null);if(Math.abs(d)>45)moverGaleriaVeiculo(d<0?1:-1)}}><img src={galeriaVeiculo.fotos[galeriaIndice]?.url_foto} loading="eager" decoding="async" className="w-full h-full object-contain" alt={`Foto ${galeriaIndice+1}`}/>{galeriaVeiculo.fotos.length>1&&<><button type="button" onClick={()=>moverGaleriaVeiculo(-1)} className="absolute left-2 sm:left-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-black/70 text-white text-3xl font-bold">‹</button><button type="button" onClick={()=>moverGaleriaVeiculo(1)} className="absolute right-2 sm:right-4 top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-black/70 text-white text-3xl font-bold">›</button></>}<span className="absolute right-3 bottom-3 rounded-full bg-black/70 text-white px-3 py-1.5 text-xs font-extrabold">{galeriaIndice+1}/{galeriaVeiculo.fotos.length}</span></div><div className="p-3 bg-white"><div className="flex gap-2 overflow-x-auto pb-1">{galeriaVeiculo.fotos.map((f,i)=><button type="button" key={f.id||`${i}-${f.url_foto}`} onClick={()=>setGaleriaIndice(i)} className={`w-20 h-16 flex-none rounded-xl overflow-hidden bg-[#F5F6F2] ${i===galeriaIndice?'ring-3 ring-[#FDCA01]':'ring-1 ring-black/10'}`}><img src={f.url_foto} loading="lazy" decoding="async" className="w-full h-full object-cover" alt={`Miniatura ${i+1}`}/></button>)}</div><div className="text-[11px] text-center text-black/45 font-semibold mt-2">Toque nas miniaturas, use as setas ou deslize a foto.</div></div></div></div>}
 </main></div>
}
ReactDOM.createRoot'''
          s=s.replace(marker,modal,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Recompilar aplicativo
        run: |
          npm install --no-save esbuild@0.25.10 react@18 react-dom@18 @supabase/supabase-js@2 heic2any@0.0.4 tailwindcss@3.4.17
          cat > entry.jsx <<'EOF'
          import ReactLib from 'react';
          import { createRoot } from 'react-dom/client';
          import { createClient as supabaseCreateClient } from '@supabase/supabase-js';
          import heic2anyLib from 'heic2any';
          const React = ReactLib;
          const ReactDOM = { createRoot };
          const supabase = { createClient: supabaseCreateClient };
          window.heic2any = heic2anyLib;
          EOF
          cat app-source.jsx >> entry.jsx
          npx esbuild entry.jsx --bundle --minify --format=iife --platform=browser --target=es2018 --outfile=app.js
          cat > tailwind-input.css <<'EOF'
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
          EOF
          cat > tailwind.config.js <<'EOF'
          module.exports={content:['./index.html','./app-source.jsx'],theme:{extend:{}},plugins:[]}
          EOF
          npx tailwindcss -c tailwind.config.js -i tailwind-input.css -o tailwind.css --minify

      - name: Retirar galeria externa e atualizar versao
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          s=re.sub(r'\n?<script src="/vehicle-gallery\.js\?v=\d+" defer></script>','',s)
          s=re.sub(r'/app\.js\?v=\d+','/app.js?v=31',s)
          s=re.sub(r'/tailwind\.css\?v=\d+','/tailwind.css?v=31',s)
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js');s=p.read_text(encoding='utf-8')
          s=re.sub(r"const CORE='catalogo-crediti-v\d+';","const CORE='catalogo-crediti-v31';",s)
          s=s.replace(",'/vehicle-gallery.js'",'').replace(",'/vehicle-gallery.js'",'')
          s=s.replace("||url.pathname==='/vehicle-gallery.js'",'')
          old="event.waitUntil(Promise.allSettled(urls.map(u=>cacheExternal(PHOTOS,u))));"
          new="event.waitUntil((async()=>{for(const u of urls){await cacheExternal(PHOTOS,u);await new Promise(r=>setTimeout(r,100));}})());"
          if old in s:s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar
        run: |
          grep -q 'galeriaVeiculo' app-source.jsx
          grep -q 'VER.*FOTOS' app-source.jsx
          ! grep -q 'vehicle-gallery.js' index.html
          test -s app.js
          test -s tailwind.css

      - name: Limpar e publicar
        run: |
          rm -f entry.jsx tailwind-input.css tailwind.config.js package.json package-lock.json
          rm -rf node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-source.jsx app.js tailwind.css index.html sw.js
          git commit -m "Integrar galeria nativa e acelerar catalogo"
          git push
