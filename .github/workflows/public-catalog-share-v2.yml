name: Aplicar catalogo publico v2

on:
  push:
    paths:
      - '.github/workflows/public-catalog-share-v2.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar alteracao
        run: python3 scripts/apply_public_catalog.py
      - name: Validar
        run: |
          grep -q "CREDITI_WHATSAPP='5585992032558'" index.html
          grep -q "Reservar / falar no WhatsApp" index.html
          grep -q "compartilharCatalogoCompleto" index.html
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Adicionar catalogo publico seguro com WhatsApp"
          git push
