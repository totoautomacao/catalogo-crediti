name: Compartilhamento com fotos e escolha de ordem

on:
  push:
    paths:
      - '.github/workflows/share-photos-picker-v26.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Aplicar novo fluxo de compartilhamento
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('app-source.jsx')
          s=p.read_text(encoding='utf-8')

          old=""" const [marcas,setMarcas]=useState([]),[modelos,setModelos]=useState([]),[anosFipe,setAnosFipe]=useState([]),[marcaBusca,setMarcaBusca]=useState(''),[modeloBusca,setModeloBusca]=useState(''),[showMarcas,setShowMarcas]=useState(false),[showModelos,setShowModelos]=useState(false),[precosVisiveis,setPrecosVisiveis]=useState({});"""
          new=""" const [marcas,setMarcas]=useState([]),[modelos,setModelos]=useState([]),[anosFipe,setAnosFipe]=useState([]),[marcaBusca,setMarcaBusca]=useState(''),[modeloBusca,setModeloBusca]=useState(''),[showMarcas,setShowMarcas]=useState(false),[showModelos,setShowModelos]=useState(false),[precosVisiveis,setPrecosVisiveis]=useState({});
 const [shareVeiculo,setShareVeiculo]=useState(null),[shareFotos,setShareFotos]=useState([]),[shareTexto,setShareTexto]=useState(''),[shareBusy,setShareBusy]=useState(false),[shareErro,setShareErro]=useState('');"""
          if old not in s: raise SystemExit('Linha de estados nao encontrada')
          s=s.replace(old,new,1)

          ini=s.index(' async function compartilhar(v){')
          fim=s.index(' return <div className=',ini)
          novo=r''' function fecharCompartilhamento(){if(shareBusy)return;setShareVeiculo(null);setShareFotos([]);setShareTexto('');setShareErro('')}
 async function abrirCompartilhamento(v){
  const base=[...(v.fotos_veiculo||[])].sort((a,b)=>(a.ordem||99)-(b.ordem||99)).slice(0,5).map((f,i)=>({key:f.id||`${i}-${f.url_foto}`,url:f.url_foto,ativo:true,file:null,loading:true,erro:false}));
  const link=`${creditCatalogoPublicoUrl()}&veiculo=${encodeURIComponent(v?.id||'')}`;
  setShareVeiculo(v);setShareFotos(base);setShareErro('');setShareBusy(false);setShareTexto(`${montarMensagemCompartilhamento(v)}\n\n🔗 *VER NO CATÁLOGO*\n${link}`);
  if(!base.length){setShareErro('Este veículo ainda não possui fotos para compartilhar.');return}
  for(let i=0;i<base.length;i++){
   const item=base[i];
   try{
    const r=await fetch(item.url,{cache:'force-cache'});
    if(!r.ok)throw new Error(`Falha ao carregar a foto ${i+1}`);
    const b=await r.blob();
    const tipo=b.type&&b.type.startsWith('image/')?b.type:'image/jpeg';
    const ext=tipo.includes('png')?'png':tipo.includes('webp')?'webp':'jpg';
    const file=new File([b],`crediti-${String(i+1).padStart(2,'0')}.${ext}`,{type:tipo});
    setShareFotos(prev=>prev.map(x=>x.key===item.key?{...x,file,loading:false,erro:false}:x));
   }catch(e){
    console.warn('Falha ao preparar foto para compartilhamento:',e);
    setShareFotos(prev=>prev.map(x=>x.key===item.key?{...x,loading:false,erro:true}:x));
   }
  }
 }
 function alternarFotoCompart(key){setShareFotos(prev=>prev.map(x=>x.key===key?{...x,ativo:!x.ativo}:x));setShareErro('')}
 function moverFotoCompart(i,dir){setShareFotos(prev=>{const j=i+dir;if(j<0||j>=prev.length)return prev;const a=[...prev];[a[i],a[j]]=[a[j],a[i]];return a})}
 function compartilharSelecionadas(){
  if(!shareVeiculo||shareBusy)return;
  const itens=shareFotos.filter(x=>x.ativo);
  if(!itens.length){setShareErro('Selecione pelo menos uma foto.');return}
  if(itens.some(x=>x.loading)){setShareErro('Aguarde as fotos terminarem de carregar.');return}
  if(itens.some(x=>x.erro||!x.file)){setShareErro('Uma das fotos não ficou pronta. Feche e abra novamente para tentar de novo.');return}
  const files=itens.map(x=>x.file);
  if(!navigator.share){setShareErro('Este navegador não oferece o menu de compartilhamento com arquivos. Abra o catálogo pelo navegador normal ou pelo aplicativo instalado.');return}
  if(navigator.canShare&&!navigator.canShare({files})){setShareErro('Este aparelho não permite compartilhar essas fotos juntas. Tente selecionar menos fotos.');return}
  setShareBusy(true);setShareErro('');
  const dados={title:`${shareVeiculo.marca||''} ${shareVeiculo.modelo||''}`.trim()||'Veículo Crediti',text:shareTexto,files};
  // navigator.share precisa ser chamado diretamente pelo toque do usuário.
  navigator.share(dados).then(()=>fecharCompartilhamento()).catch(e=>{
   if(e?.name!=='AbortError')setShareErro('Não foi possível abrir as opções de compartilhamento. Tente novamente.');
  }).finally(()=>setShareBusy(false));
 }
'''
          s=s[:ini]+novo+s[fim:]

          oldbtn='''<button onClick={()=>compartilhar(v)} className="mt-5 h-12 rounded-2xl bg-black text-white font-extrabold flex items-center justify-center gap-2"><Icon name="phone" size={17}/> Compartilhar com cliente</button><div className="text-[11px] text-center text-black/40 font-semibold mt-2">No celular/PWA, tenta enviar todas as fotos anexadas juntas.</div>'''
          newbtn='''<button onClick={()=>abrirCompartilhamento(v)} className="mt-5 h-12 rounded-2xl bg-black text-white font-extrabold flex items-center justify-center gap-2"><span className="text-lg leading-none">↗</span> Compartilhar com cliente</button><div className="text-[11px] text-center text-black/40 font-semibold mt-2">Escolha as fotos e a ordem antes de abrir WhatsApp, Instagram ou outro app.</div>'''
          if oldbtn not in s: raise SystemExit('Botao compartilhar nao encontrado')
          s=s.replace(oldbtn,newbtn,1)

          marker=''' </section></main></div>\n}\nReactDOM.createRoot'''
          modal=r''' </section>
 {shareVeiculo&&<div className="fixed inset-0 z-[100] bg-black/55 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={fecharCompartilhamento}><div className="w-full sm:max-w-xl bg-white rounded-t-[28px] sm:rounded-[28px] max-h-[92vh] overflow-y-auto soft-shadow" onClick={e=>e.stopPropagation()}><div className="sticky top-0 z-10 bg-white px-5 py-4 border-b border-black/[.07] flex items-start justify-between gap-3"><div><div className="text-[11px] uppercase tracking-[.14em] text-black/40 font-extrabold">Compartilhar com cliente</div><h3 className="text-xl font-extrabold mt-1">{creditNomePublico(shareVeiculo)}</h3></div><button type="button" onClick={fecharCompartilhamento} className="w-10 h-10 rounded-xl bg-[#F3F3EF] font-bold text-xl flex items-center justify-center">×</button></div><div className="p-5"><p className="text-sm text-black/55 font-medium">Escolha as fotos que vão ser enviadas. Use as setas para definir qual vai em 1º, 2º, 3º e assim por diante.</p>{shareFotos.length>0&&<div className="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-4">{shareFotos.map((f,i)=>{const ativos=shareFotos.filter(x=>x.ativo);const pos=f.ativo?ativos.findIndex(x=>x.key===f.key)+1:0;return <div key={f.key} className={`rounded-2xl border p-2 transition ${f.ativo?'border-black bg-white':'border-black/5 bg-[#F5F6F2] opacity-50'}`}><button type="button" onClick={()=>alternarFotoCompart(f.key)} className="relative w-full h-32 rounded-xl overflow-hidden bg-[#F5F6F2]"><img src={f.url} className="w-full h-full object-contain"/><span className={`absolute top-2 left-2 px-2 py-1 rounded-full text-[10px] font-extrabold ${f.ativo?'bg-[#FDCA01] text-black':'bg-black text-white'}`}>{f.ativo?`${pos}ª FOTO`:'NÃO ENVIAR'}</span>{f.loading&&<span className="absolute inset-x-2 bottom-2 rounded-lg bg-black/75 text-white text-[10px] py-1.5 font-bold">Preparando…</span>}{f.erro&&<span className="absolute inset-x-2 bottom-2 rounded-lg bg-red-600 text-white text-[10px] py-1.5 font-bold">Falha na foto</span>}</button><div className="grid grid-cols-2 gap-2 mt-2"><button type="button" disabled={i===0} onClick={()=>moverFotoCompart(i,-1)} className="h-9 rounded-xl bg-[#F3F3EF] font-extrabold disabled:opacity-25">←</button><button type="button" disabled={i===shareFotos.length-1} onClick={()=>moverFotoCompart(i,1)} className="h-9 rounded-xl bg-[#F3F3EF] font-extrabold disabled:opacity-25">→</button></div></div>})}</div>}<div className="mt-4 rounded-2xl bg-[#F8F8F5] border border-black/[.06] p-4"><div className="font-extrabold text-sm">Fotos + mensagem Crediti</div><div className="text-xs text-black/50 mt-1">A mensagem do veículo e o link do catálogo serão enviados junto com as fotos para o menu de compartilhamento do celular.</div></div>{shareErro&&<div className="mt-3 rounded-2xl bg-red-50 text-red-700 px-4 py-3 text-sm font-bold">{shareErro}</div>}<div className="mt-4 flex items-center justify-between gap-3 text-xs font-bold text-black/45"><span>{shareFotos.filter(x=>x.ativo&&x.file).length}/{shareFotos.filter(x=>x.ativo).length} foto(s) pronta(s)</span><span>{shareFotos.filter(x=>x.ativo).length} selecionada(s)</span></div><button type="button" disabled={shareBusy||!shareFotos.some(x=>x.ativo)||shareFotos.filter(x=>x.ativo).some(x=>x.loading||x.erro||!x.file)} onClick={compartilharSelecionadas} className="mt-3 w-full min-h-13 py-3.5 rounded-2xl bg-[#FDCA01] text-black font-extrabold disabled:opacity-40 flex items-center justify-center gap-2"><span className="text-lg">↗</span>{shareBusy?'Abrindo opções…':'Abrir opções de compartilhamento'}</button><div className="text-[11px] text-center text-black/40 font-semibold mt-2">O celular mostrará os apps disponíveis, como WhatsApp, Instagram, Mensagens e outros.</div></div></div></div>}
 </main></div>
}
ReactDOM.createRoot'''
          if marker not in s: raise SystemExit('Ponto de insercao do modal nao encontrado')
          s=s.replace(marker,modal,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Recompilar aplicativo
        run: |
          npm install --no-save esbuild@0.25.10 react@18 react-dom@18 @supabase/supabase-js@2 heic2any@0.0.4 tailwindcss@3.4.17
          cat > entry.jsx <<'EOF'
          import ReactLib from 'react';
          import { createRoot } from 'react-dom/client';
          import { createClient as supabaseCreateClient } from '@supabase/supabase-js';
          import heic2anyLib from 'heic2any';
          const React = ReactLib;
          const ReactDOM = { createRoot };
          const supabase = { createClient: supabaseCreateClient };
          window.heic2any = heic2anyLib;
          EOF
          cat app-source.jsx >> entry.jsx
          npx esbuild entry.jsx --bundle --minify --format=iife --platform=browser --target=es2018 --outfile=app.js

          cat > tailwind-input.css <<'EOF'
          @tailwind base;
          @tailwind components;
          @tailwind utilities;
          EOF
          cat > tailwind.config.js <<'EOF'
          module.exports={content:['./index.html','./app-source.jsx'],theme:{extend:{}},plugins:[]}
          EOF
          npx tailwindcss -c tailwind.config.js -i tailwind-input.css -o tailwind.css --minify

      - name: Forcar nova versao no PWA
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          s=re.sub(r'/app\.js\?v=\d+','/app.js?v=26',s)
          s=re.sub(r'/tailwind\.css\?v=\d+','/tailwind.css?v=26',s)
          p.write_text(s,encoding='utf-8')
          p=Path('sw.js');s=p.read_text(encoding='utf-8')
          s=re.sub(r"const CORE='catalogo-crediti-v\d+';","const CORE='catalogo-crediti-v26';",s)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validar
        run: |
          grep -q 'abrirCompartilhamento' app-source.jsx
          grep -q 'Abrir opções de compartilhamento' app-source.jsx
          grep -q 'navigator.share(dados)' app-source.jsx
          test -s app.js
          test -s tailwind.css

      - name: Limpar temporarios e publicar
        run: |
          rm -f entry.jsx tailwind-input.css tailwind.config.js package.json package-lock.json
          rm -rf node_modules
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-source.jsx app.js tailwind.css index.html sw.js
          git commit -m "Escolher e ordenar fotos antes de compartilhar com cliente"
          git push
