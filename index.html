<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Crediti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createClient } = supabase;

        // ⚠️ COLOQUE AS SUAS CHAVES AQUI:
        const supabaseUrl = 'SUA_URL_DO_SUPABASE';
        const supabaseKey = 'SUA_CHAVE_ANONIMA';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        function App() {
            const [veiculos, setVeiculos] = useState([]);
            const [form, setForm] = useState({ marca: '', modelo: '', ano: '', preco: '', foto_url: '' });
            const [loading, setLoading] = useState(false);

            useEffect(() => { fetchVeiculos(); }, []);

            async function fetchVeiculos() {
                const { data } = await supabaseClient.from('veiculos').select('*').order('id', { ascending: false });
                if (data) setVeiculos(data);
            }

            async function adicionarVeiculo(e) {
                e.preventDefault();
                setLoading(true);
                // Converte vírgula para ponto e guarda como número
                const precoFormatado = parseFloat(form.preco.replace(/\./g, '').replace(',', '.'));
                
                await supabaseClient.from('veiculos').insert([{ ...form, preco: precoFormatado }]);
                setForm({ marca: '', modelo: '', ano: '', preco: '', foto_url: '' });
                await fetchVeiculos();
                setLoading(false);
                alert("Veículo guardado com sucesso!");
            }

            // Função que deixa o preço como R$ 39.000,00
            function formatarMoeda(valor) {
                return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);
            }

            function enviarWhatsApp(veiculo) {
                const texto = `Olá! Vi o ${veiculo.marca} ${veiculo.modelo} (${veiculo.ano}) no Catálogo Crediti por ${formatarMoeda(veiculo.preco)} e tenho interesse.`;
                // Altere o número 55000000000 para o seu número de WhatsApp com código de país e área
                window.open(`https://wa.me/55000000000?text=${encodeURIComponent(texto)}`, '_blank');
            }

            return (
                <div className="max-w-5xl mx-auto p-4 sm:p-6">
                    <div className="bg-blue-900 rounded-xl shadow-lg p-6 mb-8 text-center">
                        <h1 className="text-4xl font-extrabold text-white tracking-tight">Catálogo Crediti</h1>
                        <p className="text-blue-200 mt-2 text-lg">Os melhores veículos aos melhores preços</p>
                    </div>
                    
                    <div className="bg-white p-6 rounded-xl shadow-md mb-10 border-t-4 border-blue-600">
                        <h2 className="text-2xl font-bold mb-6 text-gray-800 border-b pb-2">➕ Adicionar Veículo</h2>
                        <form onSubmit={adicionarVeiculo} className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div className="flex flex-col">
                                <label className="text-sm font-semibold text-gray-600 mb-1">Marca</label>
                                <input placeholder="Ex: Fiat" className="border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" value={form.marca} onChange={e => setForm({...form, marca: e.target.value})} required />
                            </div>
                            <div className="flex flex-col">
                                <label className="text-sm font-semibold text-gray-600 mb-1">Modelo</label>
                                <input placeholder="Ex: Uno Mille" className="border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" value={form.modelo} onChange={e => setForm({...form, modelo: e.target.value})} required />
                            </div>
                            <div className="flex flex-col">
                                <label className="text-sm font-semibold text-gray-600 mb-1">Ano</label>
                                <input placeholder="Ex: 2020" type="number" className="border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" value={form.ano} onChange={e => setForm({...form, ano: e.target.value})} required />
                            </div>
                            <div className="flex flex-col">
                                <label className="text-sm font-semibold text-gray-600 mb-1">Preço (R$)</label>
                                <input placeholder="Ex: 39000,00" className="border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" value={form.preco} onChange={e => setForm({...form, preco: e.target.value})} required />
                            </div>
                            <div className="flex flex-col md:col-span-2">
                                <label className="text-sm font-semibold text-gray-600 mb-1">Link da Fotografia</label>
                                <input placeholder="Cole o link da imagem aqui" className="border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" value={form.foto_url} onChange={e => setForm({...form, foto_url: e.target.value})} required />
                            </div>
                            <button disabled={loading} className="bg-blue-600 text-white p-4 rounded-lg font-bold text-lg hover:bg-blue-700 transition-colors md:col-span-2 mt-2 shadow-md">
                                {loading ? 'A guardar...' : '💾 Gravar Veículo'}
                            </button>
                        </form>
                    </div>

                    <h2 className="text-3xl font-bold mb-6 text-gray-800">🚘 Nossa Montra</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        {veiculos.length === 0 && <p className="text-gray-500 col-span-full text-center py-10 bg-white rounded-lg border">Nenhum veículo registado ainda.</p>}
                        
                        {veiculos.map(v => (
                            <div key={v.id} className="bg-white rounded-xl shadow-lg overflow-hidden border border-gray-100 hover:shadow-xl transition-shadow flex flex-col">
                                {v.foto_url ? (
                                    <img src={v.foto_url} alt="Foto do veículo" className="w-full h-56 object-cover" />
                                ) : (
                                    <div className="w-full h-56 bg-gray-200 flex items-center justify-center text-gray-400">Sem Foto</div>
                                )}
                                <div className="p-5 flex flex-col flex-grow">
                                    <h3 className="text-xl font-black text-gray-800 uppercase">{v.marca} {v.modelo}</h3>
                                    <p className="text-gray-500 mb-3 font-medium">Ano: {v.ano}</p>
                                    <p className="text-3xl font-extrabold text-green-600 mb-6 mt-auto">{formatarMoeda(v.preco)}</p>
                                    
                                    <button onClick={() => enviarWhatsApp(v)} className="w-full bg-green-500 text-white py-3 px-4 rounded-lg font-bold hover:bg-green-600 flex justify-center items-center gap-2 shadow-md transition-colors">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                                          <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                                        </svg>
                                        Tenho Interesse
                                    </button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
