function Icon({name,size=20}){const p={width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'};const m={plus:<><path d="M12 5v14M5 12h14"/></>,search:<><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></>,car:<><path d="M5 17h14M6 17v2M18 17v2"/><path d="m4 14 2-6h12l2 6v3H4z"/></>,edit:<><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></>,trash:<><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></>,phone:<><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3"/></>,upload:<><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></>,close:<><path d="M18 6 6 18M6 6l12 12"/></>,check:<><path d="m5 12 4 4L19 6"/></>,eye:<><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></>,eyeoff:<><path d="m3 3 18 18"/><path d="M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-3 3.7M6.2 6.2C3.5 8 2 12 2 12s3.5 6 10 6a10.6 10.6 0 0 0 4.1-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></>};return <svg {...p}>{m[name]}</svg>}
async function normalizarImagem(file){let blob=file;const nome=file.name.toLowerCase();const heic=file.type.includes('heic')||file.type.includes('heif')||nome.endsWith('.heic')||nome.endsWith('.heif');if(heic&&window.heic2any){blob=await heic2any({blob:file,toType:'image/jpeg',quality:.9});if(Array.isArray(blob))blob=blob[0]}return new Promise((resolve,reject)=>{const url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{try{const max=1800;let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);c.toBlob(b=>{URL.revokeObjectURL(url);if(!b)return reject(new Error('Falha ao converter imagem'));resolve(new File([b],`${file.name.replace(/\.[^.]+$/,'')}.jpg`,{type:'image/jpeg'}))},'image/jpeg',.88)}catch(e){URL.revokeObjectURL(url);reject(e)}};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error(`Formato não reconhecido: ${file.name}`))};img.src=url})}
function App(){
 const [veiculos,setVeiculos]=useState([]),[form,setForm]=useState(vazio),[fotoItens,setFotoItens]=useState([]),[originais,setOriginais]=useState([]),[formAberto,setFormAberto]=useState(false),[loading,setLoading]=useState(false),[listaLoading,setListaLoading]=useState(true),[busca,setBusca]=useState('');
 const [marcas,setMarcas]=useState([]),[modelos,setModelos]=useState([]),[anosFipe,setAnosFipe]=useState([]),[marcaBusca,setMarcaBusca]=useState(''),[modeloBusca,setModeloBusca]=useState(''),[showMarcas,setShowMarcas]=useState(false),[showModelos,setShowModelos]=useState(false),[precosVisiveis,setPrecosVisiveis]=useState({});
 useEffect(()=>{carregar()},[]);useEffect(()=>{carregarMarcas()},[form.categoria]);
 async function carregar(){setListaLoading(true);const {data,error}=await supabaseClient.from('veiculos').select('*, fotos_veiculo(id,url_foto,ordem)').order('criado_em',{ascending:false});if(error)console.error(error);else setVeiculos((data||[]).map(v=>({...v,fotos_veiculo:(v.fotos_veiculo||[]).sort((a,b)=>(a.ordem||99)-(b.ordem||99))})));setListaLoading(false)}

 async function escolherModelo(m){setForm(x=>({...x,modelo:m.nome,versao:m.nome,fipe_modelo_codigo:String(m.codigo),fipe_ano_codigo:''}));setModeloBusca(m.nome);setShowModelos(false);try{const r=await fetch(`${FIPE}/${fipeTipo(form.categoria)}/marcas/${form.fipe_marca_codigo}/modelos/${m.codigo}/anos`);const d=await r.json();setAnosFipe(Array.isArray(d)?d:[])}catch{setAnosFipe([])}}
 const marcasFiltradas=useMemo(()=>marcas.filter(m=>m.nome.toLowerCase().includes(marcaBusca.toLowerCase())).slice(0,8),[marcas,marcaBusca]);
 const modelosFiltrados=useMemo(()=>modelos.filter(m=>m.nome.toLowerCase().includes(modeloBusca.toLowerCase())).slice(0,10),[modelos,modeloBusca]);
 const filtrados=useMemo(()=>{const q=busca.toLowerCase().trim();return !q?veiculos:veiculos.filter(v=>`${v.marca} ${v.modelo} ${v.versao} ${v.ano_fabricacao} ${v.ano_modelo}`.toLowerCase().includes(q))},[veiculos,busca]);
 function abrirNovo(){setForm(vazio);setMarcaBusca('');setModeloBusca('');setFotoItens([]);setOriginais([]);setModelos([]);setAnosFipe([]);setFormAberto(true);setTimeout(()=>document.getElementById('cadastro')?.scrollIntoView({behavior:'smooth'}),50)}
 function cancelar(){setFormAberto(false);setForm(vazio);setFotoItens([]);setOriginais([])}
 async function escolherFotos(e){const disponiveis=5-fotoItens.length;const fs=Array.from(e.target.files||[]).slice(0,disponiveis);if(!fs.length)return;setLoading(true);try{const novos=[];for(const f of fs){if(f.size>12*1024*1024)throw new Error(`${f.name} ultrapassa 12 MB`);const file=await normalizarImagem(f);novos.push({tipo:'novo',key:`new-${Date.now()}-${Math.random()}`,file,preview:URL.createObjectURL(file)})}setFotoItens(prev=>[...prev,...novos].slice(0,5))}catch(err){alert(`Não consegui preparar uma das fotos: ${err.message}`)}finally{setLoading(false);e.target.value=''}}
 function removerFoto(i){setFotoItens(prev=>prev.filter((_,idx)=>idx!==i))}
 function moverFoto(i,dir){setFotoItens(prev=>{const j=i+dir;if(j<0||j>=prev.length)return prev;const a=[...prev];[a[i],a[j]]=[a[j],a[i]];return a})}
 function alternarPreco(id){setPrecosVisiveis(p=>({...p,[id]:!p[id]}))}
 async function salvar(e){e.preventDefault();setLoading(true);const base={categoria:form.categoria,placa:form.placa.trim()?form.placa.trim().toUpperCase():null,marca:form.marca.trim(),modelo:form.modelo.trim(),versao:form.versao.trim(),ano_fabricacao:Number(form.ano_fabricacao),ano_modelo:Number(form.ano_modelo),nosso_valor:toNumber(form.nosso_valor),valor_lojista:toNumber(form.valor_lojista),quilometragem:toNumber(form.quilometragem),descricao:form.descricao.trim(),fipe_marca_codigo:form.fipe_marca_codigo||null,fipe_modelo_codigo:form.fipe_modelo_codigo||null,fipe_ano_codigo:form.fipe_ano_codigo||null};let id=form.id,result;if(id)result=await supabaseClient.from('veiculos').update(base).eq('id',id).select().single();else result=await supabaseClient.from('veiculos').insert([base]).select().single();if(result.error){const duplicada=result.error.code==='23505'||String(result.error.message||'').includes('veiculos_placa_key');alert(duplicada?'Essa placa já está cadastrada. Abra o veículo existente para editar ou confira a placa informada.':`Não foi possível salvar: ${result.error.message}`);setLoading(false);return}id=id||result.data.id;if(!form.id&&id)setForm(prev=>({...prev,id}));
  const atuaisIds=fotoItens.filter(x=>x.tipo==='existente').map(x=>x.id);const remover=originais.filter(x=>!atuaisIds.includes(x.id));for(const r of remover)await supabaseClient.from('fotos_veiculo').delete().eq('id',r.id);
  let falhas=[];for(let i=0;i<fotoItens.length;i++){const item=fotoItens[i],ordem=i+1;if(item.tipo==='existente'){const u=await supabaseClient.from('fotos_veiculo').update({ordem}).eq('id',item.id);if(u.error)falhas.push(u.error.message)}else{const path=`${id}/${Date.now()}_${i}_${Math.random().toString(36).slice(2)}.jpg`;const up=await supabaseClient.storage.from('fotos').upload(path,item.file,{contentType:'image/jpeg',upsert:false});if(up.error){falhas.push(up.error.message);continue}const {data:urlData}=supabaseClient.storage.from('fotos').getPublicUrl(path);const ins=await supabaseClient.from('fotos_veiculo').insert([{veiculo_id:id,url_foto:urlData.publicUrl,ordem}]);if(ins.error)falhas.push(ins.error.message)}}
  setLoading(false);setFormAberto(false);setForm(vazio);setFotoItens([]);setOriginais([]);await carregar();if(falhas.length)alert(`Veículo salvo, mas houve falha em ${falhas.length} foto(s). ${falhas[0]}`)
 }
 function editar(v){const ordenadas=[...(v.fotos_veiculo||[])].sort((a,b)=>(a.ordem||99)-(b.ordem||99));setForm({...v,placa:v.placa||'',valor_lojista:v.valor_lojista?numeroBR(v.valor_lojista):'',nosso_valor:v.nosso_valor?numeroBR(v.nosso_valor):'',quilometragem:v.quilometragem?numeroBR(v.quilometragem):'',descricao:v.descricao||''});setMarcaBusca(v.marca||'');setModeloBusca(v.modelo||'');setOriginais(ordenadas);setFotoItens(ordenadas.map(f=>({tipo:'existente',id:f.id,url:f.url_foto,key:f.id})));setFormAberto(true);setTimeout(()=>document.getElementById('cadastro')?.scrollIntoView({behavior:'smooth'}),50)}
 async function apagar(id){if(!confirm('Deseja apagar este veículo?'))return;await supabaseClient.from('veiculos').delete().eq('id',id);carregar()}
 async function compartilhar(v){
  const fotosUrls=[...(v.fotos_veiculo||[])].sort((a,b)=>(a.ordem||99)-(b.ordem||99)).slice(0,5).map(f=>f.url_foto);
  const texto=`🚘 *OPORTUNIDADE CREDITI*\n\n*${v.marca} ${v.modelo}*${v.versao?`\nVersão: ${v.versao}`:''}\nAno: ${v.ano_fabricacao}/${v.ano_modelo}${Number(v.quilometragem||0)>0?`\nKM: ${numeroBR(v.quilometragem)} km`:''}${v.descricao?`\n\n✅ ${v.descricao}`:''}\n\n💰 *PREÇO CREDITI: ${dinheiro(v.nosso_valor)}*\n\n✨ Quando aparece um veículo que combina com o que você procura, vale conferir enquanto ele ainda está disponível. Se esse modelo faz sentido para você, me chama agora e eu te passo todos os detalhes para decidir com segurança.\n\n📲 *Quer que eu confirme a disponibilidade para você?*`;
  if(fotosUrls.length&&navigator.share){
   try{
    const files=[];

 <label><span className="text-sm font-bold block mb-2">Preço do lojista / vendedor</span><div className="relative"><span className="absolute left-4 top-1/2 -translate-y-1/2 font-bold text-black/35">R$</span><input className="field pl-12 font-bold" inputMode="numeric" placeholder="35.000,00" value={form.valor_lojista} onChange={e=>setForm({...form,valor_lojista:maskDecimal(e.target.value)})}/></div><small className="text-black/40">Uso interno. Nunca é enviado ao cliente.</small></label>
 <label><span className="text-sm font-bold block mb-2">Preço Crediti</span><div className="relative"><span className="absolute left-4 top-1/2 -translate-y-1/2 font-bold text-black/35">R$</span><input className="field pl-12 font-extrabold" inputMode="numeric" placeholder="39.000,00" value={form.nosso_valor} onChange={e=>setForm({...form,nosso_valor:maskDecimal(e.target.value)})} required/></div><small className="text-black/40">Este é o único preço enviado ao cliente.</small></label>
 <label><span className="text-sm font-bold block mb-2">Quilometragem</span><input className="field font-bold" inputMode="numeric" placeholder="100.000,00" value={form.quilometragem} onChange={e=>setForm({...form,quilometragem:maskDecimal(e.target.value)})}/><small className="text-black/40">Padrão: 100.000,00</small></label>
 <label className="md:col-span-2"><span className="text-sm font-bold block mb-2">Descrição do veículo</span><textarea className="field" placeholder="Ex: bem conservado, pneus bons, revisão em dia, ar-condicionado..." value={form.descricao} onChange={e=>setForm({...form,descricao:e.target.value})}></textarea></label>
 <label className="md:col-span-2"><span className="text-sm font-bold block mb-2">Fotos do veículo, até 5</span><div className="min-h-[58px] rounded-2xl border border-dashed border-black/20 bg-[#F8F8F5] relative flex items-center gap-3 px-4"><Icon name="upload" size={19}/><span className="text-sm font-semibold text-black/55">{fotoItens.length?`${fotoItens.length} foto(s) selecionada(s)`:'Selecione até 5 fotos'}</span><input className="absolute inset-0 opacity-0 cursor-pointer" type="file" multiple accept="image/*,.jpg,.jpeg,.jfif,.png,.webp,.heic,.heif,.bmp,.gif" onChange={escolherFotos}/></div><small className="text-black/40">A 1ª foto é a capa. Use as setas para reorganizar.</small></label>
 {fotoItens.length>0&&<div className="md:col-span-2 grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">{fotoItens.map((f,i)=><div className="photo-card" key={f.key}><button type="button" className="photo-x" onClick={()=>removerFoto(i)}>×</button>{i===0&&<span className="cover-badge">CAPA</span>}<span className="position-badge">{i+1}ª FOTO</span><img src={f.tipo==='existente'?f.url:f.preview}/><div className="photo-order"><button type="button" disabled={i===0} onClick={()=>moverFoto(i,-1)}>←</button><button type="button" disabled={i===fotoItens.length-1} onClick={()=>moverFoto(i,1)}>→</button></div></div>)}</div>}
 <div className="md:col-span-2 flex gap-3 justify-end"><button type="button" onClick={cancelar} className="h-12 px-5 rounded-2xl bg-[#F3F3EF] font-bold">Cancelar</button><button disabled={loading} className="h-12 px-6 rounded-2xl bg-[#FDCA01] font-extrabold flex items-center gap-2 disabled:opacity-50"><Icon name="check" size={18}/>{loading?'Processando...':'Salvar veículo'}</button></div>
 </form></section>}
 <section className="mt-10"><div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-6"><div><div className="text-xs uppercase tracking-[.15em] text-black/40 font-bold">Disponíveis</div><h2 className="text-3xl font-extrabold">Veículos do catálogo</h2></div><div className="relative sm:w-96"><span className="absolute left-4 top-1/2 -translate-y-1/2 text-black/35"><Icon name="search" size={18}/></span><input className="field pl-11" placeholder="Buscar veículo" value={busca} onChange={e=>setBusca(e.target.value)}/></div></div>
 {listaLoading?<div className="text-center py-14 font-semibold text-black/40">Carregando catálogo...</div>:<div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">{filtrados.map(v=><article key={v.id} className="bg-white rounded-[24px] overflow-hidden border border-black/[.06] soft-shadow flex flex-col"><div className="h-64 bg-white flex items-center justify-center overflow-hidden">{v.fotos_veiculo?.[0]?.url_foto?<img src={v.fotos_veiculo[0].url_foto} className="w-full h-full object-contain" alt={`${v.marca} ${v.modelo}`}/>:<div className="text-black/25 font-semibold">Sem foto</div>}</div><div className="p-5 flex flex-col flex-1"><div className="text-xs uppercase tracking-[.14em] text-black/35 font-bold">{v.categoria||'Veículo'}</div><h3 className="text-xl font-extrabold mt-1">{v.marca} {v.modelo}</h3>{v.versao&&v.versao!==v.modelo&&<p className="text-sm text-black/55 mt-1">{v.versao}</p>}<div className="flex flex-wrap gap-2 mt-3 text-xs font-semibold text-black/55"><span className="px-3 py-2 rounded-full bg-[#F5F6F2]">{v.ano_fabricacao}/{v.ano_modelo}</span>{Number(v.quilometragem||0)>0&&<span className="px-3 py-2 rounded-full bg-[#F5F6F2]">{numeroBR(v.quilometragem)} km</span>}{v.fotos_veiculo?.length>1&&<span className="px-3 py-2 rounded-full bg-[#F5F6F2]">{v.fotos_veiculo.length} fotos</span>}</div>{v.descricao&&<p className="text-sm text-black/55 mt-4">{v.descricao}</p>}<div className="mt-5"><small className="text-black/40 font-semibold">Preço Crediti</small><div className="text-2xl font-extrabold">{dinheiro(v.nosso_valor)}</div></div><div className="mt-3 flex items-center justify-end gap-2">{precosVisiveis[v.id]&&<span className="text-sm font-extrabold">{Number(v.valor_lojista||0)>0?dinheiro(v.valor_lojista):'Não informado'}</span>}<button type="button" className="eye-btn" onClick={()=>alternarPreco(v.id)} title={precosVisiveis[v.id]?'Ocultar preço':'Mostrar preço'}><Icon name={precosVisiveis[v.id]?'eyeoff':'eye'} size={18}/></button></div><button onClick={()=>compartilhar(v)} className="mt-5 h-12 rounded-2xl bg-black text-white font-extrabold flex items-center justify-center gap-2"><Icon name="phone" size={17}/> Compartilhar com cliente</button><div className="text-[11px] text-center text-black/40 font-semibold mt-2">No celular/PWA, tenta enviar todas as fotos anexadas juntas.</div><div className="grid grid-cols-2 gap-2 mt-2"><button onClick={()=>editar(v)} className="h-11 rounded-2xl bg-[#F4F4F0] font-bold flex items-center justify-center gap-2"><Icon name="edit" size={16}/>Editar</button><button onClick={()=>apagar(v.id)} className="h-11 rounded-2xl bg-[#F4F4F0] font-bold flex items-center justify-center gap-2"><Icon name="trash" size={16}/>Apagar</button></div></div></article>)}{filtrados.length===0&&<div className="col-span-full text-center py-16 bg-white rounded-3xl text-black/45 font-semibold">Nenhum veículo encontrado.</div>}</div>}
 </section></main></div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(console.error)); }
</script>
</body>
</html>
