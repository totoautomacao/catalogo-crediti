<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Crediti</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createClient } = supabase;

        const supabaseUrl = 'https://jfguumxlxmveuszddyky.supabase.co';
        const supabaseKey = 'sb_publishable_F84YmaFbhJGUmNXYrye1Rw_h6xKvW3B';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        function App() {
            const [veiculos, setVeiculos] = useState([]);
            const [form, setForm] = useState({ marca: '', modelo: '', ano_fabricacao: '', ano_modelo: '', preco: '', foto_url: '' });
            const [editingId, setEditingId] = useState(null);
            const [loading, setLoading] = useState(false);

            useEffect(() => { fetchVeiculos(); }, []);

            async function fetchVeiculos() {
                const { data } = await supabaseClient.from('veiculos').select('*').order('id', { ascending: false });
                if (data) setVeiculos(data);
            }

            function handlePrecoChange(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value === '') {
                    setForm({ ...form, preco: '' });
                    return;
                }
                let numero = (parseFloat(value) / 100).toFixed(2);
                let formatado = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(numero).replace('R$', '').trim();
                setForm({ ...form, preco: formatado });
            }

            function handleImageUpload(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setForm({ ...form, foto_url: reader.result });
                    };
                    reader.readAsDataURL(file);
                }
            }

            async function guardarVeiculo(e) {
                e.preventDefault();
                setLoading(true);
                
                const precoNumerico = typeof form.preco === 'string' ? parseFloat(form.preco.replace(/\./g, '').replace(',', '.')) : form.preco;
                const dadosVeiculo = { 
                    marca: form.marca,
                    modelo: form.modelo,
                    ano: `${form.ano_fabricacao}/${form.ano_modelo}`,
                    preco: precoNumerico,
                    foto_url: form.foto_url 
                };

                if (editingId) {
                    await supabaseClient.from('veiculos').update(dadosVeiculo).eq('id', editingId);
                    setEditingId(null);
                    alert("Veículo atualizado com sucesso!");
                } else {
                    await supabaseClient.from('veiculos').insert([dadosVeiculo]);
                    alert("Veículo guardado com sucesso!");
                }

                setForm({ marca: '', modelo: '', ano_fabricacao: '', ano_modelo: '', preco: '', foto_url: '' });
                await fetchVeiculos();
                setLoading(false);
            }

            async function apagarVeiculo(id) {
                if (confirm("Tem certeza que deseja apagar este veículo?")) {
                    await supabaseClient.from('veiculos').delete().eq('id', id);
                    fetchVeiculos();
                }
            }

            function editarVeiculo(v) {
                setEditingId(v.id);
                const anos = v.ano ? v.ano.split('/') : ['', ''];
                const precoStr = v.preco ? new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2 }).format(v.preco) : '';
                setForm({
                    marca: v.marca || '',
                    modelo: v.modelo || '',
                    ano_fabricacao: anos[0] || '',
                    ano_modelo: anos[1] || '',
                    preco: precoStr,
                    foto_url: v.foto_url || ''
                });
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            function enviarWhatsApp(veiculo) {
                const precoFormatado = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(veiculo.preco);
                const texto = `Olá! Vi o ${veiculo.marca} ${veiculo.modelo} (${veiculo.ano}) no Catálogo Crediti por ${precoFormatado} e tenho interesse.`;
                window.open(`https://wa.me/55000000000?text=${encodeURIComponent(texto)}`, '_blank');
            }

            return (
                <div className="max-w-5xl mx-auto p-4 sm:p-6 text-black">
                    <div className="bg-yellow-400 border-4 border-black rounded-xl shadow-xl p-6 mb-8 text-center">
                        <h1 className="text-4xl font-black text-black tracking-tight uppercase">Catálogo Crediti</h1>
                        <p className="text-black mt-2 font-bold text-lg">Os melhores veículos aos melhores preços</p>
                    </div>
                    
                    <div className="bg-white p-6 rounded-xl shadow-md mb-10 border-4 border-black">
                        <h2 className="text-2xl font-black mb-6 text-black border-b-2 border-black pb-2">
                            {editingId ? '✏️ Editar Veículo' : '➕ Adicionar Novo Veículo'}
                        </h2>
                        <form onSubmit={guardarVeiculo} className="grid grid-cols-1 md:grid-cols-2 gap-5">
                            <div className="flex flex-col">
                                <label className="text-sm font-bold text-black mb-1">Marca</label>
                                <input placeholder="Ex: Fiat" className="border-2 border-black p-3 rounded-lg font-medium outline-none" value={form.marca} onChange={e => setForm({...form, marca: e.target.value})} required />
                            </div>
                            <div className="flex flex-col">
                                <label className="text-sm font-bold text-black mb-1">Modelo</label>
                                <input placeholder="Ex: Uno Mille" className="border-2 border-black p-3 rounded-lg font-medium outline-none" value={form.modelo} onChange={e => setForm({...form, modelo: e.target.value})} required />
                            </div>
                            <div className="flex flex-col">
                                <label className="text-sm font-bold text-black mb-1">Ano de Fabricação</label>
                                <input placeholder="Ex: 2019" type="number" className="border-2 border-black p-3 rounded-lg font-medium outline-none" value={form.ano_fabricacao} onChange={e => setForm({...form, ano_fabricacao: e.target.value})} required />
                            </div>
                            <div className="flex flex-col">
                                <label className="text-sm font-bold text-black mb-1">Ano do Modelo</label>
                                <input placeholder="Ex: 2020" type="number" className="border-2 border-black p-3 rounded-lg font-medium outline-none" value={form.ano_modelo} onChange={e => setForm({...form, ano_modelo: e.target.value})} required />
                            </div>
                            <div className="flex flex-col">
                                <label className="text-sm font-bold text-black mb-1">Preço (R$)</label>
                                <input placeholder="39.000,00" className="border-2 border-black p-3 rounded-lg font-bold text-lg outline-none text-green-700" value={form.preco} onChange={handlePrecoChange} required />
                            </div>
                            <div className="flex flex-col">
                                <label className="text-sm font-bold text-black mb-1">Fotografia do Veículo</label>
                                <input type="file" accept="image/*" onChange={handleImageUpload} className="border-2 border-black p-2.5 rounded-lg font-medium bg-gray-50 cursor-pointer" />
                            </div>
                            <button disabled={loading} className="bg-yellow-400 border-2 border-black text-black p-4 rounded-lg font-black text-lg hover:bg-yellow-500 transition-colors md:col-span-2 mt-2 shadow-md">
                                {loading ? 'A guardar...' : (editingId ? '💾 Atualizar Veículo' : '💾 Gravar Veículo')}
                            </button>
                        </form>
                    </div>

                    <h2 className="text-3xl font-black mb-6 text-black uppercase">🚘 Catálogo de Veículos</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        {veiculos.length === 0 && <p className="text-black font-bold col-span-full text-center py-10 bg-white rounded-lg border-2 border-black">Nenhum veículo registado ainda.</p>}
                        
                        {veiculos.map(v => (
                            <div key={v.id} className="bg-white rounded-xl shadow-lg overflow-hidden border-2 border-black flex flex-col">
                                {v.foto_url ? (
                                    <img src={v.foto_url} alt="Foto do veículo" className="w-full h-56 object-cover border-b-2 border-black" />
                                ) : (
                                    <div className="w-full h-56 bg-gray-200 flex items-center justify-center font-bold text-black border-b-2 border-black">Sem Foto</div>
                                )}
                                <div className="p-5 flex flex-col flex-grow">
                                    <h3 className="text-xl font-black text-black uppercase">{v.marca} {v.modelo}</h3>
                                    <p className="text-black font-bold mb-3">Ano: {v.ano}</p>
                                    <p className="text-3xl font-black text-green-700 mb-4 mt-auto">R$ {v.preco ? Number(v.preco).toLocaleString('pt-BR', {minimumFractionDigits: 2}) : '0,00'}</p>
                                    
                                    <div className="space-y-2">
                                        <button onClick={() => enviarWhatsApp(v)} className="w-full bg-green-500 border-2 border-black text-white py-2.5 px-4 rounded-lg font-black hover:bg-green-600 flex justify-center items-center gap-2 shadow-md transition-colors">
                                            📲 Partilhar WhatsApp
                                        </button>
                                        <div className="flex gap-2">
                                            <button onClick={() => editarVeiculo(v)} className="w-1/2 bg-yellow-300 border-2 border-black text-black py-2 rounded-lg font-black hover:bg-yellow-400 transition-colors">
                                                ✏️ Editar
                                            </button>
                                            <button onClick={() => apagarVeiculo(v.id)} className="w-1/2 bg-red-500 border-2 border-black text-white py-2 rounded-lg font-black hover:bg-red-600 transition-colors">
                                                🗑️ Apagar
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
