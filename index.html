<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FDCA01" />
  <title>Catálogo Crediti</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--crediti:#FDCA01;--ink:#111;--ice:#F5F6F2;--line:#E7E7E2}
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 88% 2%,rgba(253,202,1,.18),transparent 25rem),var(--ice);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
    button,input,textarea,select{font:inherit}.glass{background:rgba(255,255,255,.86);backdrop-filter:blur(14px)}
    .soft-shadow{box-shadow:0 12px 36px rgba(18,18,18,.07)}
    .field{width:100%;min-height:50px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 15px;outline:none;transition:.18s ease}
    textarea.field{padding:14px 15px;min-height:110px;resize:vertical}
    .field:focus{border-color:#111;box-shadow:0 0 0 4px rgba(17,17,17,.06)}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useEffect,useMemo,useState}=React;
const {createClient}=supabase;
const supabaseClient=createClient('https://jfguumxlxmveuszddyky.supabase.co','sb_publishable_F84YmaFbhJGUmNXYrye1Rw_h6xKvW3B');
const FIPE='https://parallelum.com.br/fipe/api/v1';

const vazio={id:null,categoria:'Carro',placa:'',marca:'',modelo:'',versao:'',ano_fabricacao:'',ano_modelo:'',nosso_valor:'',valor_lojista:'',quilometragem:'',descricao:'',fipe_marca_codigo:'',fipe_modelo_codigo:'',fipe_ano_codigo:''};
const dinheiro=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));
const formatMoneyInput=v=>{const d=String(v||'').replace(/\D/g,'');if(!d)return '';return new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(d)/100)};
const toNumber=v=>Number(String(v||'').replace(/\./g,'').replace(',','.'))||0;
const fipeTipo=c=>c==='Moto'?'motos':'carros';

function Icon({name,size=20}){const p={width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'};const m={plus:<><path d="M12 5v14M5 12h14"/></>,search:<><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></>,car:<><path d="M5 17h14M6 17v2M18 17v2"/><path d="m4 14 2-6h12l2 6v3H4z"/></>,edit:<><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></>,trash:<><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></>,phone:<><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3"/></>,upload:<><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></>,close:<><path d="M18 6 6 18M6 6l12 12"/></>,check:<><path d="m5 12 4 4L19 6"/></>};return <svg {...p}>{m[name]}</svg>}

function App(){
 const [veiculos,setVeiculos]=useState([]),[form,setForm]=useState(vazio),[fotos,setFotos]=useState([]),[formAberto,setFormAberto]=useState(false),[loading,setLoading]=useState(false),[listaLoading,setListaLoading]=useState(true),[busca,setBusca]=useState('');
 const [marcas,setMarcas]=useState([]),[modelos,setModelos]=useState([]),[anosFipe,setAnosFipe]=useState([]),[marcaBusca,setMarcaBusca]=useState(''),[modeloBusca,setModeloBusca]=useState(''),[showMarcas,setShowMarcas]=useState(false),[showModelos,setShowModelos]=useState(false);

 useEffect(()=>{carregar();},[]);
 useEffect(()=>{carregarMarcas();},[form.categoria]);

 async function carregar(){
  setListaLoading(true);
  const {data,error}=await supabaseClient.from('veiculos').select('*, fotos_veiculo(id,url_foto)').order('criado_em',{ascending:false});
  if(error) console.error(error); else setVeiculos(data||[]);
  setListaLoading(false);
 }

 async function carregarMarcas(){
  try{const r=await fetch(`${FIPE}/${fipeTipo(form.categoria)}/marcas`);const d=await r.json();setMarcas(Array.isArray(d)?d:[]);}catch(e){console.warn('FIPE indisponível',e)}
 }

 async function escolherMarca(m){
  setForm(x=>({...x,marca:m.nome,fipe_marca_codigo:String(m.codigo),modelo:'',versao:'',fipe_modelo_codigo:'',fipe_ano_codigo:''}));
  setMarcaBusca(m.nome);setModeloBusca('');setShowMarcas(false);setAnosFipe([]);
  try{const r=await fetch(`${FIPE}/${fipeTipo(form.categoria)}/marcas/${m.codigo}/modelos`);const d=await r.json();setModelos(d.modelos||[]);}catch(e){setModelos([])}
 }

 async function escolherModelo(m){
  setForm(x=>({...x,modelo:m.nome,versao:m.nome,fipe_modelo_codigo:String(m.codigo),fipe_ano_codigo:''}));
  setModeloBusca(m.nome);setShowModelos(false);
  try{const r=await fetch(`${FIPE}/${fipeTipo(form.categoria)}/marcas/${form.fipe_marca_codigo}/modelos/${m.codigo}/anos`);const d=await r.json();setAnosFipe(Array.isArray(d)?d:[]);}catch(e){setAnosFipe([])}
 }

 const marcasFiltradas=useMemo(()=>marcas.filter(m=>m.nome.toLowerCase().includes(marcaBusca.toLowerCase())).slice(0,8),[marcas,marcaBusca]);
 const modelosFiltrados=useMemo(()=>modelos.filter(m=>m.nome.toLowerCase().includes(modeloBusca.toLowerCase())).slice(0,10),[modelos,modeloBusca]);
 const filtrados=useMemo(()=>{const q=busca.toLowerCase().trim();return !q?veiculos:veiculos.filter(v=>`${v.marca} ${v.modelo} ${v.versao} ${v.ano_fabricacao} ${v.ano_modelo}`.toLowerCase().includes(q))},[veiculos,busca]);

 function abrirNovo(){setForm(vazio);setMarcaBusca('');setModeloBusca('');setFotos([]);setModelos([]);setAnosFipe([]);setFormAberto(true);setTimeout(()=>document.getElementById('cadastro')?.scrollIntoView({behavior:'smooth'}),50)}
 function cancelar(){setFormAberto(false);setForm(vazio);setFotos([])}
 function escolherFotos(e){const fs=Array.from(e.target.files||[]).slice(0,5);if(fs.some(f=>f.size>6*1024*1024)){alert('Cada foto deve ter no máximo 6 MB.');return}setFotos(fs)}

 async function salvar(e){
  e.preventDefault();setLoading(true);
  const base={categoria:form.categoria,placa:form.placa.trim().toUpperCase(),marca:form.marca.trim(),modelo:form.modelo.trim(),versao:form.versao.trim(),ano_fabricacao:Number(form.ano_fabricacao),ano_modelo:Number(form.ano_modelo),nosso_valor:toNumber(form.nosso_valor)};
  const extras={valor_lojista:toNumber(form.valor_lojista),quilometragem:Number(form.quilometragem||0),descricao:form.descricao.trim(),fipe_marca_codigo:form.fipe_marca_codigo||null,fipe_modelo_codigo:form.fipe_modelo_codigo||null,fipe_ano_codigo:form.fipe_ano_codigo||null};
  let id=form.id, result;
  if(id) result=await supabaseClient.from('veiculos').update({...base,...extras}).eq('id',id).select().single();
  else result=await supabaseClient.from('veiculos').insert([{...base,...extras}]).select().single();

  if(result.error && /valor_lojista|quilometragem|descricao|fipe_/i.test(result.error.message||'')){
   if(id) result=await supabaseClient.from('veiculos').update(base).eq('id',id).select().single();
   else result=await supabaseClient.from('veiculos').insert([base]).select().single();
  }
  if(result.error){console.error(result.error);alert(`Não foi possível salvar: ${result.error.message}`);setLoading(false);return}
  id=id||result.data?.id;

  if(id && fotos.length){
   const existentes=form.fotos_veiculo?.length||0;
   const permitidas=fotos.slice(0,Math.max(0,5-existentes));
   for(const file of permitidas){
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
    const path=`${id}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
    const up=await supabaseClient.storage.from('fotos').upload(path,file,{upsert:false});
    if(up.error){console.error(up.error);continue}
    const {data:urlData}=supabaseClient.storage.from('fotos').getPublicUrl(path);
    await supabaseClient.from('fotos_veiculo').insert([{veiculo_id:id,url_foto:urlData.publicUrl}]);
   }
  }
  setLoading(false);setFormAberto(false);setForm(vazio);setFotos([]);await carregar();
 }

 function editar(v){setForm({...v,valor_lojista:v.valor_lojista?new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2}).format(v.valor_lojista):'',nosso_valor:v.nosso_valor?new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2}).format(v.nosso_valor):'',quilometragem:v.quilometragem||'',descricao:v.descricao||''});setMarcaBusca(v.marca||'');setModeloBusca(v.modelo||'');setFotos([]);setFormAberto(true);setTimeout(()=>document.getElementById('cadastro')?.scrollIntoView({behavior:'smooth'}),50)}
 async function apagar(id){if(!confirm('Deseja apagar este veículo?'))return;await supabaseClient.from('veiculos').delete().eq('id',id);carregar()}

 async function compartilhar(v){
  const fotosUrls=(v.fotos_veiculo||[]).slice(0,5).map(f=>f.url_foto);
  const km=Number(v.quilometragem||0).toLocaleString('pt-BR');
  const descricao=v.descricao?`\n${v.descricao}\n`:'';
  const texto=`🚗 *${v.marca} ${v.modelo}*\n${v.versao?`Versão: ${v.versao}\n`:''}Ano: ${v.ano_fabricacao}/${v.ano_modelo}${v.quilometragem?`\nKM: ${km} km`:''}${descricao}\n💰 *${dinheiro(v.nosso_valor)}*\n\nEsse pode ser o carro que você estava esperando. Se fizer sentido para você, me chama agora e eu confirmo a disponibilidade antes de você decidir.`;
  if(fotosUrls.length && navigator.share && navigator.canShare){
   try{const files=[];for(let i=0;i<fotosUrls.length;i++){const r=await fetch(fotosUrls[i]);const b=await r.blob();files.push(new File([b],`veiculo-${i+1}.jpg`,{type:b.type||'image/jpeg'}))}if(navigator.canShare({files})){await navigator.share({text:texto,files});return}}catch(e){console.warn(e)}
  }
  const links=fotosUrls.length?`\n\nFotos:\n${fotosUrls.join('\n')}`:'';
  window.open(`https://wa.me/?text=${encodeURIComponent(texto+links)}`,'_blank');
 }

 return <div className="min-h-screen pb-16">
  <header className="glass sticky top-0 z-40 border-b border-black/5"><div className="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between"><div className="flex items-center gap-3"><div className="w-10 h-10 rounded-2xl bg-[#FDCA01] flex items-center justify-center"><Icon name="car"/></div><div><b className="text-lg">Crediti</b><div className="text-[11px] uppercase tracking-[.15em] text-black/45 font-semibold">Catálogo de veículos</div></div></div><button onClick={abrirNovo} className="h-11 px-4 rounded-2xl bg-black text-white font-bold flex items-center gap-2"><Icon name="plus" size={18}/> Novo veículo</button></div></header>

  <main className="max-w-7xl mx-auto px-4 sm:px-6 pt-7">
   <section className="rounded-[30px] bg-[#FDCA01] p-6 sm:p-9 soft-shadow"><span className="inline-flex px-3 py-2 rounded-full bg-black text-white text-xs font-bold">ESTOQUE CREDITI</span><h1 className="text-4xl sm:text-6xl font-extrabold tracking-[-.05em] leading-none mt-5 max-w-3xl">Seu catálogo de carros e motos.</h1><p className="mt-4 text-black/60 font-medium">Cadastre, organize e compartilhe oportunidades com seus clientes.</p></section>

   {formAberto&&<section id="cadastro" className="scroll-mt-24 mt-7 bg-white rounded-[26px] border border-black/[.06] soft-shadow overflow-visible">
    <div className="px-5 sm:px-7 py-5 border-b border-black/[.06] flex items-center justify-between"><div><div className="text-xs uppercase tracking-[.15em] text-black/40 font-bold">Cadastro</div><h2 className="text-2xl font-extrabold">{form.id?'Editar veículo':'Novo veículo'}</h2></div><button onClick={cancelar} className="w-10 h-10 rounded-xl bg-[#F5F6F2] flex items-center justify-center"><Icon name="close" size={18}/></button></div>
    <form onSubmit={salvar} className="p-5 sm:p-7 grid grid-cols-1 md:grid-cols-2 gap-5">
     <label><span className="text-sm font-bold block mb-2">Categoria</span><select className="field" value={form.categoria} onChange={e=>{setForm({...form,categoria:e.target.value,marca:'',modelo:'',versao:'',fipe_marca_codigo:'',fipe_modelo_codigo:''});setMarcaBusca('');setModeloBusca('');setModelos([])}}><option>Carro</option><option>Moto</option></select></label>
     <label><span className="text-sm font-bold block mb-2">Placa</span><input className="field uppercase" placeholder="ABC1D23" value={form.placa} onChange={e=>setForm({...form,placa:e.target.value})}/></label>

     <div className="relative"><span className="text-sm font-bold block mb-2">Marca FIPE</span><input className="field" placeholder="Digite Fiat, Chevrolet, Honda..." value={marcaBusca} onFocus={()=>setShowMarcas(true)} onChange={e=>{setMarcaBusca(e.target.value);setShowMarcas(true);setForm({...form,marca:e.target.value,fipe_marca_codigo:''})}} required/>{showMarcas&&marcaBusca&&<div className="absolute z-30 left-0 right-0 mt-2 bg-white border border-black/10 rounded-2xl shadow-xl overflow-hidden max-h-64 overflow-y-auto">{marcasFiltradas.map(m=><button type="button" key={m.codigo} onClick={()=>escolherMarca(m)} className="w-full text-left px-4 py-3 hover:bg-[#FFF5C2] font-semibold text-sm">{m.nome}</button>)}</div>}</div>

     <div className="relative"><span className="text-sm font-bold block mb-2">Modelo / versão FIPE</span><input className="field" placeholder={form.fipe_marca_codigo?'Comece a digitar o modelo':'Escolha a marca primeiro'} value={modeloBusca} onFocus={()=>setShowModelos(true)} onChange={e=>{setModeloBusca(e.target.value);setShowModelos(true);setForm({...form,modelo:e.target.value,versao:e.target.value,fipe_modelo_codigo:''})}} required/>{showModelos&&modeloBusca&&modelos.length>0&&<div className="absolute z-30 left-0 right-0 mt-2 bg-white border border-black/10 rounded-2xl shadow-xl overflow-hidden max-h-72 overflow-y-auto">{modelosFiltrados.map(m=><button type="button" key={m.codigo} onClick={()=>escolherModelo(m)} className="w-full text-left px-4 py-3 hover:bg-[#FFF5C2] font-semibold text-sm">{m.nome}</button>)}</div>}</div>

     <label><span className="text-sm font-bold block mb-2">Ano fabricação</span><input className="field" type="number" placeholder="2024" value={form.ano_fabricacao} onChange={e=>setForm({...form,ano_fabricacao:e.target.value})} required/></label>
     <label><span className="text-sm font-bold block mb-2">Ano modelo</span><input className="field" list="anos-fipe" type="number" placeholder="2025" value={form.ano_modelo} onChange={e=>setForm({...form,ano_modelo:e.target.value})} required/><datalist id="anos-fipe">{anosFipe.map(a=><option key={a.codigo} value={String(a.nome).slice(0,4)}/>)}</datalist></label>

     <label><span className="text-sm font-bold block mb-2">Preço do lojista / vendedor</span><div className="relative"><span className="absolute left-4 top-1/2 -translate-y-1/2 font-bold text-black/35">R$</span><input className="field pl-12 font-bold" inputMode="numeric" placeholder="35.000,00" value={form.valor_lojista} onChange={e=>setForm({...form,valor_lojista:formatMoneyInput(e.target.value)})}/></div><small className="text-black/40">Uso interno. Não vai para o cliente.</small></label>
     <label><span className="text-sm font-bold block mb-2">Preço Crediti</span><div className="relative"><span className="absolute left-4 top-1/2 -translate-y-1/2 font-bold text-black/35">R$</span><input className="field pl-12 font-extrabold" inputMode="numeric" placeholder="39.000,00" value={form.nosso_valor} onChange={e=>setForm({...form,nosso_valor:formatMoneyInput(e.target.value)})} required/></div><small className="text-black/40">Este é o único preço enviado ao cliente.</small></label>

     <label><span className="text-sm font-bold block mb-2">Quilometragem</span><input className="field" type="number" placeholder="58.000" value={form.quilometragem} onChange={e=>setForm({...form,quilometragem:e.target.value})}/></label>
     <label className="md:col-span-2"><span className="text-sm font-bold block mb-2">Descrição do veículo</span><textarea className="field" placeholder="Ex: bem conservado, pneus bons, revisão em dia, ar-condicionado..." value={form.descricao} onChange={e=>setForm({...form,descricao:e.target.value})}></textarea></label>

     <label className="md:col-span-2"><span className="text-sm font-bold block mb-2">Fotos do veículo, até 5</span><div className="min-h-[58px] rounded-2xl border border-dashed border-black/20 bg-[#F8F8F5] relative flex items-center gap-3 px-4"><Icon name="upload" size={19}/><span className="text-sm font-semibold text-black/55">{fotos.length?`${fotos.length} foto(s) selecionada(s)`:'Selecionar até 5 fotos'}</span><input className="absolute inset-0 opacity-0 cursor-pointer" type="file" multiple accept="image/*" onChange={escolherFotos}/></div></label>

     {(fotos.length>0||form.fotos_veiculo?.length>0)&&<div className="md:col-span-2 grid grid-cols-2 sm:grid-cols-5 gap-3">{(form.fotos_veiculo||[]).slice(0,5).map((f,i)=><div key={`old${i}`} className="h-32 rounded-2xl bg-white border overflow-hidden"><img src={f.url_foto} className="w-full h-full object-contain"/></div>)}{fotos.slice(0,Math.max(0,5-(form.fotos_veiculo?.length||0))).map((f,i)=><div key={i} className="h-32 rounded-2xl bg-white border overflow-hidden"><img src={URL.createObjectURL(f)} className="w-full h-full object-contain"/></div>)}</div>}

     <div className="md:col-span-2 flex gap-3 justify-end"><button type="button" onClick={cancelar} className="h-12 px-5 rounded-2xl bg-[#F3F3EF] font-bold">Cancelar</button><button disabled={loading} className="h-12 px-6 rounded-2xl bg-[#FDCA01] font-extrabold flex items-center gap-2 disabled:opacity-50"><Icon name="check" size={18}/>{loading?'Salvando...':'Salvar veículo'}</button></div>
    </form>
   </section>}

   <section className="mt-10"><div className="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-6"><div><div className="text-xs uppercase tracking-[.15em] text-black/40 font-bold">Disponíveis</div><h2 className="text-3xl font-extrabold">Veículos do catálogo</h2></div><div className="relative sm:w-96"><span className="absolute left-4 top-1/2 -translate-y-1/2 text-black/35"><Icon name="search" size={18}/></span><input className="field pl-11" placeholder="Buscar veículo" value={busca} onChange={e=>setBusca(e.target.value)}/></div></div>
    {listaLoading?<div className="text-center py-14 font-semibold text-black/40">Carregando catálogo...</div>:<div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">{filtrados.map(v=><article key={v.id} className="bg-white rounded-[24px] overflow-hidden border border-black/[.06] soft-shadow flex flex-col"><div className="h-64 bg-white flex items-center justify-center overflow-hidden">{v.fotos_veiculo?.[0]?.url_foto?<img src={v.fotos_veiculo[0].url_foto} className="w-full h-full object-contain" alt={`${v.marca} ${v.modelo}`}/>:<div className="text-black/25 font-semibold">Sem foto</div>}</div><div className="p-5 flex flex-col flex-1"><div className="text-xs uppercase tracking-[.14em] text-black/35 font-bold">{v.categoria||'Veículo'}</div><h3 className="text-xl font-extrabold mt-1">{v.marca} {v.modelo}</h3>{v.versao&&v.versao!==v.modelo&&<p className="text-sm text-black/55 mt-1">{v.versao}</p>}<div className="flex flex-wrap gap-2 mt-3 text-xs font-semibold text-black/55"><span className="px-3 py-2 rounded-full bg-[#F5F6F2]">{v.ano_fabricacao}/{v.ano_modelo}</span>{v.quilometragem>0&&<span className="px-3 py-2 rounded-full bg-[#F5F6F2]">{Number(v.quilometragem).toLocaleString('pt-BR')} km</span>}{v.fotos_veiculo?.length>1&&<span className="px-3 py-2 rounded-full bg-[#F5F6F2]">{v.fotos_veiculo.length} fotos</span>}</div>{v.descricao&&<p className="text-sm text-black/55 mt-4 line-clamp-3">{v.descricao}</p>}<div className="mt-5"><small className="text-black/40 font-semibold">Preço Crediti</small><div className="text-2xl font-extrabold">{dinheiro(v.nosso_valor)}</div></div><button onClick={()=>compartilhar(v)} className="mt-5 h-12 rounded-2xl bg-black text-white font-extrabold flex items-center justify-center gap-2"><Icon name="phone" size={17}/> Compartilhar com cliente</button><div className="grid grid-cols-2 gap-2 mt-2"><button onClick={()=>editar(v)} className="h-11 rounded-2xl bg-[#F4F4F0] font-bold flex items-center justify-center gap-2"><Icon name="edit" size={16}/>Editar</button><button onClick={()=>apagar(v.id)} className="h-11 rounded-2xl bg-[#F4F4F0] font-bold flex items-center justify-center gap-2"><Icon name="trash" size={16}/>Apagar</button></div></div></article>)}{filtrados.length===0&&<div className="col-span-full text-center py-16 bg-white rounded-3xl text-black/45 font-semibold">Nenhum veículo encontrado.</div>}</div>}
   </section>
  </main>
 </div>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
